<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SightLine — Demo (invented data)</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* SightLine wordmark */
    .hs-word { font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: 5px; color: #FF8A1F; text-shadow: 0 0 12px rgba(255,138,31,.45); }
    .hs-word b { font-weight: 900; background: linear-gradient(90deg, #3B82F6, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(59,130,246,.55)); }
    .hs-tag { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 3.5px; color: #7A93B0; margin-top: 6px; }
    @keyframes hs-scan { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    .hs-iris { animation: hs-scan 5s ease-in-out infinite; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0F1923; color: #E2E8F0; min-height: 100vh; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; }
    button { font-family: inherit; }
    input[type=file] { display: none; }
    @keyframes pulse { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #1A2535; }
    ::-webkit-scrollbar-thumb { background: #4A6280; border-radius: 6px; border: 2px solid #1A2535; }
    ::-webkit-scrollbar-thumb:hover { background: #6B86A8; }
    /* every table scrolls inside its own box that fits the window: both scrollbars stay on screen and the header row stays put */
    .tbl-scroll { overflow: auto; max-height: calc(100vh - 210px); }
    .tbl-scroll thead th { position: sticky; top: 0; z-index: 2; background: #1E3A5F; }
    /* the validation tables size to their content instead of stretching across the page, so the check columns stay narrow and the columns sit close together */
    table.fit { width: auto; }
    table.fit th, table.fit td { padding-left: 9px !important; padding-right: 9px !important; }
    table.fit td { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;
    // The portal talks to whichever address it was opened from, so it keeps working when the server's IP changes
    // (office wifi, home VPN, ...). Opened as a plain file, it falls back to the machine it is running on.
    // ?server=http://1.2.3.4:5050 points the page at a server on another machine (when portal.html is opened as a file or hosted elsewhere).
    const API = (() => {
      const asked = new URLSearchParams(window.location.search).get("server");
      if (asked) return asked.replace(/\/+$/, "");
      return /^https?:$/.test(window.location.protocol) ? window.location.origin : "http://localhost:5050";
    })();
    const PAGE_BUILD = "SIGHTLINE // DEMO-1";   // must equal BUILD in server.py

    const C = {
      bg:     "#0F1923",
      panel:  "#162030",
      card:   "#1C2C3E",
      border: "#243450",
      text:   "#E2E8F0",
      sub:    "#7A93B0",
      blue:   "#3B82F6",
      green:  "#22C55E",
      greenD: "#15803D",
      red:    "#EF4444",
      redD:   "#991B1B",
      amber:  "#F59E0B",
      amberD: "#92400E",
      navy:   "#1E3A5F",
      steel:  "#2F5D8C",
    };

    const TABS = [":\\WARP DRIVE","Validation","Delivery Flow","Create Buysheet","Req Upload","Prod Check","ItemHub","RetailPortal","SAP"];

    function StatCard({ label, count, sub, color, note }) {
      return (
        <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, padding:"20px 24px", minWidth:180 }}>
          <div style={{ color:C.sub, fontSize:11, fontWeight:600, letterSpacing:1, marginBottom:8 }}>{label}</div>
          <div style={{ fontSize:32, fontWeight:700, color: count > 0 ? color : C.green }}>{count}</div>
          <div style={{ color:C.sub, fontSize:12, marginTop:4 }}>{count > 0 ? (note || `${count} need attention`) : sub || "All clear!"}</div>
        </div>
      );
    }

    function Pill({ label, color, bg }) {
      return <span style={{ display:"inline-block", padding:"2px 9px", borderRadius:4, fontSize:11, fontWeight:600, color, background:bg }}>{label}</span>;
    }
    function StatusPill({ status }) {
      if (status==="✓ EXISTS")  return <Pill label="EXISTS"   color="#16A34A" bg="#052E16"/>;
      if (status==="✗ MISSING") return <Pill label="MISSING"  color="#EF4444" bg="#3B0000"/>;
      if (status==="EXISTS")    return <Pill label="EXISTS"   color="#16A34A" bg="#052E16"/>;
      if (status==="MISSING")   return <Pill label="MISSING"  color="#EF4444" bg="#3B0000"/>;
      if (status==="MISMATCH")  return <Pill label="MISMATCH" color="#F59E0B" bg="#2D1B00"/>;
      return <Pill label={status||"—"} color={C.sub} bg={C.card}/>;
    }
    function CheckPill({ val, tip }) {          // tip: the numbers or words behind the check (the cell's hover), shown under the status text
      const v = val || "—";
      const t = tip ? (v==="✓" ? tip : `${v}
${tip}`) : v;
      if (v==="✓")       return <span title={tip || undefined} style={{ color:"#16A34A", fontWeight:700, fontSize:13 }}>✓</span>;
      const clip = { display:"inline-block", maxWidth:112, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", verticalAlign:"bottom" };   // a long message never widens its column: hover for all of it
      if (v.startsWith("✗")) return <span title={t} style={{ color:"#EF4444", fontWeight:700, fontSize:11, ...clip }}>{v}</span>;
      if (v.startsWith("⚠")) return <span title={t} style={{ color:"#F59E0B", fontSize:11, ...clip }}>{v}</span>;
      if (v.startsWith("ℹ")) return <span title={t} style={{ color:"#60A5FA", fontSize:11, fontWeight:600, ...clip }}>{v}</span>;
      return <span title={t} style={{ color:C.sub, fontSize:11, ...clip }}>{v}</span>;
    }

    function TabBar({ active, onChange }) {
      return (
        <div style={{ display:"flex", borderBottom:`1px solid ${C.border}`, marginBottom:28 }}>
          {TABS.map(t => (
            <button key={t} onClick={() => onChange(t)}
              style={{ padding:"12px 20px", background:"none", border:"none", cursor:"pointer",
                color: active===t ? C.blue : C.sub,
                borderBottom: active===t ? `2px solid ${C.blue}` : "2px solid transparent",
                fontWeight: active===t ? 600 : 400, fontSize:13, letterSpacing:0.5,
                transition:"all 0.15s" }}>
              {t}
            </button>
          ))}
        </div>
      );
    }

    function RowCounts({ rows }) {
      const ppk    = rows.filter(r=>r.type==="PPK").length;
      const os     = rows.filter(r=>r.type==="OS").length;
      const ecom   = rows.filter(r=>r.type==="ECOM").length;
      return (
        <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, padding:"16px 20px", marginBottom:24 }}>
          <div style={{ color:C.sub, fontSize:11, fontWeight:600, letterSpacing:1, marginBottom:12 }}>ROW COUNTS</div>
          {[["TOTAL",rows.length],["PPK",ppk],["OS",os],["ECOM",ecom]].map(([k,v])=>(
            <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0",
              borderBottom:`1px solid ${C.border}` }}>
              <span style={{ color:C.sub, fontSize:13 }}>{k}</span>
              <span style={{ fontWeight:600, fontSize:13 }}>{v}</span>
            </div>
          ))}
        </div>
      );
    }

    // What is already in stock for an open-stock line (from the SAP Cut and Sold export); hover for the split by segment / location.
    function StockCell({ r }) {
      const st = r.stock;
      const altN = (r.alt_stock||[]).reduce((a,x)=>a+x.inv, 0);
      const altTip = (r.alt_stock||[]).map(x => `Same color "${x.color}" under code ${x.code}: ${Number(x.inv).toLocaleString()} on hand (${x.article})`).join("\n");
      const altEl = altN > 0 ? <span title={altTip} style={{ color:C.amber, fontWeight:600, fontSize:11, cursor:"help", whiteSpace:"nowrap" }}> · {Number(altN).toLocaleString()} as code {(r.alt_stock||[]).map(x=>x.code).join("/")}</span> : null;
      if (!st) return altEl || <span style={{ color:C.sub }}>—</span>;
      const n = v => Number(v).toLocaleString();
      const OTHER = { transfer:"in transfer", quality:"in quality inspection", restricted:"restricted", blocked:"blocked", returns:"returns" };
      const otherText = o => Object.entries(o||{}).filter(([,v]) => v).map(([k,v]) => `${n(v)} ${OTHER[k]||k}`).join(", ");
      const tip = (st.by||[]).map(b => `${b.segment||"-"} / ${b.sloc||"-"}: ${n(b.inv)} on hand`
            + (b.ats != null ? ` · ${n(b.ats)} ATS` : "") + (otherText(b.other) ? ` · ${otherText(b.other)}` : "")).join("\n")
        + ([["On PO", st.on_po], ["In transit", st.in_txt], ["Open orders", st.order], ["Oversold", st.oversold]].some(([,v]) => v != null)
            ? "\n" + [["On PO", st.on_po], ["In transit", st.in_txt], ["Open orders", st.order], ["Oversold", st.oversold]].filter(([,v]) => v != null).map(([k,v]) => `${k} ${n(v)}`).join(" · ") : "")
        + (st.source === "hana" ? "\nLive from HANA (unrestricted stock, as on the Cut and Sold report)" : "\nFrom the Cut and Sold export");
      if (!(st.inv > 0)) return st.other_total > 0
        ? <span data-testid="stock-cell" title={tip} style={{ color:C.sub, fontSize:11, cursor:"help", whiteSpace:"nowrap" }}>— <span style={{ fontSize:10 }}>· {n(st.other_total)} other</span>{altEl}</span>
        : <span style={{ color:C.sub }}>—{altEl}</span>;
      return (
        <span data-testid="stock-cell" title={tip} style={{ color:"#60A5FA", fontWeight:600, fontSize:11, cursor:"help", whiteSpace:"nowrap" }}>
          {n(st.inv)}
          {st.ats != null && st.ats !== st.inv ? <span style={{ color:C.sub, fontWeight:400 }}> ({n(st.ats)} ATS)</span> : null}
          {st.other_total > 0 ? <span style={{ color:C.sub, fontWeight:400, fontSize:10 }}> · {n(st.other_total)} other</span> : null}
          {st.on_po > 0 ? <span style={{ color:C.amber, fontWeight:400 }}> · PO {Number(st.on_po).toLocaleString()}</span> : null}
          {altEl}
        </span>
      );
    }

    // For a prepack: its own stock if the report lists it, else how much of its components is in stock and how many packs that could make.
    function PpkStockCell({ r }) {
      const st = r.stock;
      if (!st) return <span style={{ color:C.sub }}>—</span>;
      const own = st.own;
      const tip = (own ? `The prepack itself: ${Number(own.inv).toLocaleString()} on hand\n` : "")
        + (r.components||[]).filter(c => !r.complex || c.code === r.color_code).map(c => `${c.size}: ${Number(c.inv||0).toLocaleString()} on hand (${c.qty} per pack) · ${c.article}`).join("\n");
      if (own && own.inv > 0) return <span data-testid="stock-cell" title={tip} style={{ color:"#60A5FA", fontWeight:600, fontSize:11, cursor:"help", whiteSpace:"nowrap" }}>{Number(own.inv).toLocaleString()} on hand</span>;
      if (st.components_in_stock > 0) return (
        <span data-testid="stock-cell" title={tip} style={{ color:"#60A5FA", fontWeight:600, fontSize:11, cursor:"help", whiteSpace:"nowrap" }}>
          {st.components_in_stock}/{st.components} sizes<span style={{ color:C.sub, fontWeight:400 }}> · {st.packs > 0 ? `≈${Number(st.packs).toLocaleString()} packs` : "no full pack"}</span>
        </span>);
      return <span style={{ color:C.sub }}>—</span>;
    }

    // The hold master: only what was asked of it, two lists. Color codes the file gets wrong, and what is in stock (one line per style / color,
    // one column per storage location, click a line for its sizes). Built on the server from the same checks; exported as one workbook.
    function HoldCheck({ data }) {
      const [view, setView] = React.useState(null);
      const [err, setErr]   = React.useState("");
      const [tab, setTab]   = React.useState("colors");
      const [open, setOpen] = React.useState({});
      React.useEffect(() => {
        setView(null); setErr("");
        fetch(`${API}/hold_check`).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || "Could not build the lists"); setView(j); }).catch(e => setErr(e.message));
      }, [data]);
      const n = v => Number(v || 0).toLocaleString();
      const colors = view?.colors || [], stock = view?.stock || [], locs = view?.locations || [];
      const KIND = { "WRONG NAME":[C.red,"#3B0000"], "NEW ON STYLE":[C.amber,"#2D1B00"], "NOT IN SAP":[C.red,"#3B0000"], "NO CODE":[C.amber,"#2D1B00"], "NO COLOR NAME":[C.amber,"#2D1B00"] };
      const CF = useColFilters(colors, [{ h:"Problem", get:r=>r.kind }, { h:"Style", get:r=>r.style }, { h:"File code", get:r=>r.code }, { h:"Customers", get:r=>r.customers.join(", ") }], view);
      const SF = useColFilters(stock, [{ h:"Style", get:r=>r.style }, { h:"Code", get:r=>r.code }, { h:"Color", get:r=>r.sap_color }], view);
      const th = { padding:"8px 12px", color:C.sub, fontWeight:600, fontSize:10, whiteSpace:"nowrap", textAlign:"left" };
      const thR = { ...th, textAlign:"right" };
      const td = { padding:"8px 12px", fontSize:12 };
      const tdR = { ...td, textAlign:"right", fontVariantNumeric:"tabular-nums" };
      const btn = (id, label) => (
        <button key={id} onClick={()=>setTab(id)} style={{ padding:"6px 18px", border:"none", borderRadius:4, fontSize:12, fontWeight:600, cursor:"pointer", background: tab===id ? C.steel : "none", color: tab===id ? "#fff" : C.sub }}>{label}</button>);
      return (
        <div data-testid="hold-check">
          <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, flexWrap:"wrap" }}>
            <div style={{ display:"flex", background:C.card, border:`1px solid ${C.border}`, borderRadius:6, padding:3 }}>
              {btn("colors", `Color mismatches (${colors.length})`)}{btn("stock", `In stock (${stock.length})`)}
            </div>
            <div style={{ color:C.sub, fontSize:12 }}>{view ? `${view.file} · ${n(view.lines)} size lines checked against SAP` : ""}</div>
            <a href={`${API}/hold_check/export`} data-testid="hold-export" style={{ marginLeft:"auto", background:C.navy, border:`1px solid ${C.border}`, color:"#fff", borderRadius:5, padding:"6px 14px", fontSize:12, fontWeight:600, textDecoration:"none" }}>Export to Excel →</a>
          </div>
          {err && <div style={{ marginBottom:14, padding:"10px 14px", background:"#3B0000", color:C.red, borderRadius:6, fontSize:13 }}>{err}</div>}
          {!view && !err && <div style={{ color:C.sub, fontSize:13 }}>Building the lists…</div>}

          {view && tab==="colors" && (
            <div style={{ background:C.card, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
              <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`, fontSize:12, color:C.sub }}>
                {colors.length ? <span>Each line is a color code in the file that SAP does not agree with. SAP's name for the code is shown beside what the file says: <b style={{ color:C.text }}>which one is wrong is for you to decide</b>.</span>
                               : <span style={{ color:C.green, fontWeight:600 }}>Every color code in the file matches SAP.</span>}
              </div>
              <FilterBar F={CF} total={colors.length}/>
              {colors.length > 0 && (
                <div className="tbl-scroll"><table className="fit">
                  <thead><tr style={{ background:C.navy }}>
                    <FilterTh F={CF} h="Problem" style={th}/><FilterTh F={CF} h="Style" style={th}/><FilterTh F={CF} h="File code" style={th}/>
                    <th style={th}>File says</th><th style={th}>SAP says for that code</th><FilterTh F={CF} h="Customers" style={th}/><th style={thR}>Hold units</th>
                  </tr></thead>
                  <tbody>{CF.shown.map((r,i)=>(
                    <tr key={i} title={r.problem} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                      <td style={td}><Pill label={r.kind} color={KIND[r.kind]?.[0]||C.sub} bg={KIND[r.kind]?.[1]||C.card}/></td>
                      <td style={{ ...td, fontWeight:600 }}>{r.style}</td>
                      <td style={{ ...td, color:C.sub }}>{r.code || "—"}</td>
                      <td style={td}>{r.file_color || "—"}</td>
                      <td style={{ ...td, color: r.kind==="WRONG NAME" ? C.amber : C.text, fontWeight:600 }}>{r.sap_color || "—"}</td>
                      <td style={{ ...td, color:C.sub }}>{r.customers.join(", ")}</td>
                      <td style={tdR}>{n(r.units)}</td>
                    </tr>))}</tbody>
                </table></div>)}
            </div>)}

          {view && tab==="stock" && (
            <div style={{ background:C.card, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
              <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`, fontSize:12, color:C.sub }}>
                Unrestricted stock on hand per style and color, by storage location (hover a number for its segments). Click a line for its sizes.
              </div>
              <FilterBar F={SF} total={stock.length}/>
              <div className="tbl-scroll"><table className="fit">
                <thead><tr style={{ background:C.navy }}>
                  <FilterTh F={SF} h="Style" style={th}/><FilterTh F={SF} h="Code" style={th}/><FilterTh F={SF} h="Color" style={th}/>
                  <th style={thR}>Hold units</th><th style={thR}>On hand</th>
                  {locs.map(l => <th key={l} style={thR}>{l}</th>)}
                  <th style={th}>Same color, other code</th>
                </tr></thead>
                <tbody>{SF.shown.map((r,i)=>{
                  const k = r.style + "|" + r.code;
                  return (
                    <React.Fragment key={k}>
                      <tr onClick={()=>setOpen(o=>({ ...o, [k]: !o[k] }))} style={{ cursor:"pointer", borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                        <td style={{ ...td, fontWeight:600 }}><span style={{ color:C.sub, marginRight:6 }}>{open[k] ? "▾" : "▸"}</span>{r.style}</td>
                        <td style={{ ...td, color:C.sub }}>{r.code}</td>
                        <td style={td}>{r.sap_color}</td>
                        <td style={tdR}>{n(r.hold)}</td>
                        <td style={{ ...tdR, color:r.inv>0?"#60A5FA":C.sub, fontWeight:700 }}>{r.inv>0 ? n(r.inv) : "—"}</td>
                        {locs.map(l => { const x = r.locations[l]; return (
                          <td key={l} style={{ ...tdR, color:x?C.text:C.sub }} title={x ? Object.entries(x.segments).map(([s,v])=>`${s}: ${n(v)}`).join("\n") : ""}>{x ? n(x.inv) : "·"}</td>); })}
                        <td style={{ ...td, color:C.amber }}>{r.alt.map(a=>`${a.code}: ${n(a.inv)}`).join("  ·  ")}</td>
                      </tr>
                      {open[k] && (
                        <tr style={{ background:"#0F1B2B" }}><td colSpan={6 + locs.length} style={{ padding:"6px 12px 10px 38px" }}>
                          <table style={{ fontSize:11, borderCollapse:"collapse" }}>
                            <thead><tr style={{ color:C.sub }}><th style={{ ...th, padding:"3px 14px 3px 0" }}>Size</th><th style={{ ...thR, padding:"3px 14px" }}>Hold units</th><th style={{ ...thR, padding:"3px 14px" }}>On hand</th><th style={{ ...th, padding:"3px 14px" }}>Article</th></tr></thead>
                            <tbody>{r.sizes.map(s => (
                              <tr key={s.size}><td style={{ padding:"2px 14px 2px 0", fontWeight:600 }}>{s.size}</td><td style={{ padding:"2px 14px", textAlign:"right" }}>{n(s.hold)}</td>
                                <td style={{ padding:"2px 14px", textAlign:"right", color:s.inv>0?"#60A5FA":C.sub }}>{s.inv>0 ? n(s.inv) : "—"}</td><td style={{ padding:"2px 14px", color:C.sub }}>{s.article || "not in SAP"}</td></tr>))}</tbody>
                          </table>
                        </td></tr>)}
                    </React.Fragment>);
                })}</tbody>
              </table></div>
            </div>)}
        </div>
      );
    }

    // "×N": the same result appears on N rows of the DATA sheet (several customers / deliveries); hover to see where.
    // A style with more than one price, MSRP or fineline in the file (the same generic typed two ways): every value and where it was typed.
    function ConsistencyPanel({ items }) {
      if (!items || !items.length) return null;
      const name = { price:"price", price_cad:"CAD price", price_usd:"USD price", msrp:"MSRP", fineline:"fineline" };
      const show = (kind, v) => kind === "fineline" ? String(v) : `$${Number(v).toFixed(2)}`;
      const n = new Set(items.map(i => i.style)).size;
      return (
        <details open data-testid="consistency" style={{ background:C.card, border:`1px solid ${C.amber}`, borderRadius:8, padding:"10px 14px", marginBottom:22, fontSize:12 }}>
          <summary style={{ cursor:"pointer", fontWeight:700, color:C.amber }}>{n} style{n===1?"":"s"} with more than one price, MSRP or fineline in this file</summary>
          <div style={{ maxHeight:260, overflowY:"auto", marginTop:8 }}>
            {items.map((it, i) => (
              <div key={i} style={{ padding:"4px 0", borderBottom:`1px solid ${C.border}` }}>
                <span style={{ fontWeight:700, color:C.text }}>{it.style}</span>
                <span style={{ color:C.sub }}> · different {name[it.kind]}: </span>
                {it.values.map((v, j) => (
                  <span key={j} title={`${v.rows} row${v.rows===1?"":"s"}\n${v.articles.join(", ")}\n${v.customers.join(", ")}`} style={{ color:C.text, marginRight:12 }}>
                    <b>{show(it.kind, v.value)}</b> <span style={{ color:C.sub }}>({v.rows} row{v.rows===1?"":"s"}{v.customers.length ? `, ${v.customers.slice(0,2).join(" / ")}${v.customers.length>2 ? "…" : ""}` : ""})</span>
                  </span>
                ))}
              </div>
            ))}
          </div>
        </details>
      );
    }

    function Repeats({ r }) {
      if (!r.count || r.count < 2) return null;
      const who = (r.customers||[]).join(", "), when = (r.deliveries||[]).join(", ");
      return (
        <span data-testid="repeats" style={{ color:C.amber, fontSize:9, marginLeft:6, fontWeight:700, cursor:"help" }}
          title={`The same result on ${r.count} rows of the DATA sheet${who ? "\ncustomers: " + who : ""}${when ? "\ndeliveries: " + when : ""}${r.qty ? "\ntotal qty: " + Number(r.qty).toLocaleString() : ""}`}>×{r.count}</span>
      );
    }

    // ── column filters: every header gets a ▾ that opens that column's values (with counts); tick the ones to keep ──
    // cols = [{ h: header text, get: row => the value the column shows }]. A check column is reduced to pass / fail / warning.
    const chk = v => { const s = String(v ?? ""); return !s || s==="—" ? "—" : s[0]==="✓" ? "✓ pass" : s[0]==="✗" ? "✗ fail" : s[0]==="⚠" ? "⚠ warning" : s[0]==="ℹ" ? "ℹ info" : s; };
    function useColFilters(rows, cols, resetKey) {
      const [f, setF] = React.useState({});                              // header -> Set of the values to keep
      React.useEffect(() => { setF({}); }, [resetKey]);                   // new data: start unfiltered
      const active = Object.keys(f).length;
      const shown = active ? rows.filter(r => cols.every(c => !f[c.h] || f[c.h].has(String(c.get(r) ?? "")))) : rows;
      const set = (h, v) => setF(o => { const n = { ...o }; if (v) n[h] = v; else delete n[h]; return n; });
      return { shown, f, set, clear: () => setF({}), active, cols, rows };
    }
    function FilterTh({ F, h, style }) {
      const [pos, setPos] = React.useState(null);
      const [q, setQ]     = React.useState("");
      const col = F.cols.find(c => c.h === h);
      if (!col) return <th style={style}>{h}</th>;
      const on = !!F.f[h];
      let counts = [];
      if (pos) {
        const m = new Map();
        F.rows.forEach(r => { const v = String(col.get(r) ?? ""); m.set(v, (m.get(v) || 0) + 1); });
        counts = [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric:true }));
      }
      const all = counts.map(([v]) => v);
      const sel = F.f[h];
      const isOn = v => !sel || sel.has(v);
      const toggle = v => { const s = new Set(sel || all); s.has(v) ? s.delete(v) : s.add(v); F.set(h, s.size === all.length ? null : s); };
      const list = counts.filter(([v]) => v.toLowerCase().includes(q.toLowerCase()));
      const open = e => { const b = e.currentTarget.getBoundingClientRect(); setQ(""); setPos({ top:b.bottom + 4, left:Math.max(8, Math.min(b.left, window.innerWidth - 270)) }); };
      return (
        <th style={style}>
          <span style={{ display:"inline-flex", alignItems:"center", gap:4 }}>
            {h}
            <button data-testid="col-filter" title={on ? "Filtered: click to change" : "Filter this column"} onClick={open}
              style={{ background: on ? C.blue : "none", color: on ? "#fff" : C.sub, border:"none", borderRadius:3, padding:"0 4px", fontSize:9, cursor:"pointer", lineHeight:"14px" }}>▾</button>
          </span>
          {pos && (
            <div>
              <div onClick={()=>setPos(null)} style={{ position:"fixed", inset:0, zIndex:50 }}/>
              <div style={{ position:"fixed", top:pos.top, left:pos.left, width:250, zIndex:51, background:C.card, border:`1px solid ${C.border}`, borderRadius:6, padding:10, boxShadow:"0 8px 24px #000a", fontWeight:400, textAlign:"left" }}>
                <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={`Search ${h || "column"}`}
                  style={{ width:"100%", boxSizing:"border-box", background:C.navy, color:C.text, border:`1px solid ${C.border}`, borderRadius:4, padding:"5px 8px", fontSize:12, marginBottom:8 }}/>
                <div style={{ display:"flex", gap:12, fontSize:11, marginBottom:6 }}>
                  <a style={{ color:C.blue, cursor:"pointer" }} onClick={()=>F.set(h, null)}>Select all</a>
                  <a style={{ color:C.blue, cursor:"pointer" }} onClick={()=>F.set(h, new Set(q ? all.filter(v => !list.some(([x]) => x === v)) : []))}>{q ? "Hide matches" : "Clear"}</a>
                  <a style={{ color:C.blue, cursor:"pointer", marginLeft:"auto" }} onClick={()=>F.set(h, new Set(list.map(([v]) => v)))}>Only these</a>
                </div>
                <div style={{ maxHeight:240, overflowY:"auto" }}>
                  {list.slice(0, 300).map(([v, n]) => (
                    <label key={v} style={{ display:"flex", gap:8, alignItems:"center", padding:"3px 2px", fontSize:12, color:C.text, cursor:"pointer", whiteSpace:"nowrap" }}>
                      <input type="checkbox" checked={isOn(v)} onChange={()=>toggle(v)}/>
                      <span style={{ overflow:"hidden", textOverflow:"ellipsis", flex:1 }}>{v === "" ? "(blank)" : v}</span>
                      <span style={{ color:C.sub, fontSize:11 }}>{n}</span>
                    </label>
                  ))}
                  {list.length > 300 && <div style={{ color:C.sub, fontSize:11, padding:"4px 2px" }}>{list.length - 300} more: type to narrow the list</div>}
                  {!list.length && <div style={{ color:C.sub, fontSize:11, padding:"4px 2px" }}>No values</div>}
                </div>
              </div>
            </div>
          )}
        </th>
      );
    }
    function FilterBar({ F, total }) {
      if (!F.active) return null;
      return (
        <div data-testid="col-filter-bar" style={{ display:"flex", gap:12, alignItems:"center", padding:"6px 14px", fontSize:12, color:C.amber }}>
          <span>Column filters on {Object.keys(F.f).join(", ")}: showing {F.shown.length.toLocaleString()} of {total.toLocaleString()} rows</span>
          <button onClick={F.clear} style={{ background:"none", border:`1px solid ${C.border}`, color:C.sub, borderRadius:5, padding:"2px 10px", fontSize:11, cursor:"pointer" }}>Clear filters</button>
        </div>
      );
    }

    // One chip per check: how many rows passed / failed / were only warned about. Click a chip to see just those rows.
    function ValidationBoard({ data, filter, setFilter, setViewMode, onReport }) {
      const S = data?.summary || {};
      const groups = [
        { scope:"gen", title:"OPEN STOCK", view:"GENERIC", rows:(data?.generic_unique||data?.generic||[]).length, checks:S.checks_gen||[] },
        { scope:"ppk", title:"PREPACKS",   view:"PPK",     rows:(data?.ppk_unique||data?.ppk||[]).length,     checks:S.checks_ppk||[] },
      ].filter(g => g.rows > 0);
      const all = groups.flatMap(g => g.checks);
      const bad = all.reduce((a,c)=>a+c.bad, 0), warn = all.reduce((a,c)=>a+c.warn, 0);
      const inStock = all.filter(c=>c.key==="stock_check").reduce((a,c)=>a+(c.info||0), 0);     // information, not a problem
      const clean = bad === 0 && warn === 0;
      return (
        <div data-testid="validation-board" style={{ background:C.card, border:`1px solid ${clean ? C.greenD : bad ? C.redD : C.amber}`, borderRadius:10, padding:"14px 18px", marginBottom:20 }}>
          <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:12 }}>
            <div style={{ fontSize:13, fontWeight:700, letterSpacing:0.6 }}>VALIDATION</div>
            <div style={{ fontSize:13, fontWeight:600, color: clean ? C.green : bad ? C.red : C.amber }}>
              {clean ? "✓ Every check passes" : `${bad} failure${bad===1?"":"s"} · ${warn} warning${warn===1?"":"s"}`}
            </div>
            {inStock > 0 && <div data-testid="in-stock-total" style={{ fontSize:12, color:"#60A5FA", fontWeight:600 }}>ℹ {inStock} line{inStock===1?"":"s"} already in stock</div>}
            <div style={{ flex:1 }}/>
            {filter && <button onClick={()=>setFilter(null)} style={{ background:"none", border:`1px solid ${C.border}`, color:C.sub, borderRadius:5, padding:"4px 12px", fontSize:11, cursor:"pointer" }}>Show all rows</button>}
            <button onClick={onReport} style={{ background:C.navy, border:`1px solid ${C.border}`, color:"#fff", borderRadius:5, padding:"5px 14px", fontSize:11, fontWeight:600, cursor:"pointer" }}>Download validation report →</button>
          </div>
          {groups.map(g => (
            <div key={g.scope} style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:8 }}>
              <div style={{ width:92, color:C.sub, fontSize:10, fontWeight:700, letterSpacing:0.8 }}>{g.title}</div>
              {g.checks.filter(c => c.ok + c.bad + c.warn > 0).map(c => {
                const active = filter && filter.scope===g.scope && filter.key===c.key;
                const issue = c.bad + c.warn + (c.info||0) > 0;
                const edge = c.bad ? C.red : c.warn ? C.amber : C.greenD;
                return (
                  <button key={c.key} data-testid={`chip-${g.scope}-${c.key}`} disabled={!issue} title={`${c.ok} pass · ${c.bad} fail · ${c.warn} warning · ${c.na} not applicable (${g.title.toLowerCase()} rows)`}
                    onClick={()=>{ if (active) setFilter(null); else { setFilter({ scope:g.scope, key:c.key, label:c.label }); setViewMode(g.view); } }}
                    style={{ display:"flex", gap:8, alignItems:"center", padding:"5px 11px", borderRadius:6, fontSize:11, cursor: issue ? "pointer" : "default",
                      background: active ? "#243450" : "#111B2B", border:`1px solid ${active ? C.blue : edge}`, color:C.text }}>
                    <span style={{ fontWeight:600 }}>{c.label}</span>
                    <span style={{ color:C.green }}>✓ {c.ok}</span>
                    {c.bad > 0  && <span style={{ color:C.red,   fontWeight:700 }}>✗ {c.bad}</span>}
                    {c.warn > 0 && <span style={{ color:C.amber, fontWeight:700 }}>⚠ {c.warn}</span>}
                    {c.info > 0 && <span style={{ color:"#60A5FA", fontWeight:700 }}>ℹ {c.info}</span>}
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      );
    }

    // Under an expanded prepack row: the file's ratio against the components SAP holds, size by size.
    function ComponentPanel({ r }) {
      const comps = (r.components || []).filter(c => !r.complex || c.code === r.color_code);
      const fileSz = String(r.buy_sizes || "").split("-").filter(Boolean), fileRt = String(r.buy_ratio || "").split("-").filter(Boolean);
      const file = {}; fileSz.forEach((s,i)=>{ file[s] = fileRt[i]; });
      const sap = {}; comps.forEach(c => { sap[c.size] = c; });
      const sizes = [...fileSz, ...comps.map(c=>c.size).filter(s => !fileSz.includes(s))];
      const hasS = r.stock !== undefined && r.stock !== null;       // a stock report is loaded
      const th = { padding:"5px 10px", color:C.sub, fontSize:10, fontWeight:600, textAlign:"left", whiteSpace:"nowrap" };
      const td = { padding:"5px 10px", fontSize:11, whiteSpace:"nowrap" };
      const mono = { ...td, fontFamily:"ui-monospace, Menlo, Consolas, monospace" };
      return (
