            {r.exists==="✓ EXISTS"
              ? <span>Components of <b style={{ color:C.text }}>{r.ppk_article}</b> in SAP{r.complex ? <span> — color <b style={{ color:C.text }}>{r.color_code}</b> of {[...new Set((r.components||[]).map(c=>c.code))].length} colors</span> : null} · {r.ratio_note ? <span style={{ color:C.red }}>{r.ratio_note}</span> : <span style={{ color:C.green }}>file ratio matches</span>}{hasS && r.stock.components > 0 ? <span style={{ color:"#60A5FA" }}> · stock: {r.stock.components_in_stock} of {r.stock.components} sizes in stock{r.stock.packs > 0 ? `, enough for ≈${Number(r.stock.packs).toLocaleString()} packs` : ""}</span> : null}</span>
              : <span>{r.ppk_article} is not in SAP, so there is nothing to compare. The file says <b style={{ color:C.text }}>{r.buy_sizes || "—"}</b> / <b style={{ color:C.text }}>{r.buy_ratio || "—"}</b>.</span>}
          </div>
          {r.exists!=="✓ EXISTS" && r.readiness && (
            <div data-testid="readiness-panel" style={{ marginBottom:8 }}>
              <div style={{ fontSize:12, fontWeight:600, marginBottom:6, color: r.readiness.state==="ready" ? C.green : C.red }}>
                {r.readiness.state==="ready" ? "✓ Ready to create: every component exists in SAP." : `✗ Blocked: ${r.readiness.message}`}
              </div>
              <table>
                <thead><tr><th style={th}>COLOR CODE</th><th style={th}>SIZE</th><th style={th}>QTY PER PACK</th><th style={th}>VARIANT ARTICLE (Batch)</th><th style={th}>STATUS</th></tr></thead>
                <tbody>
                  {r.readiness.components.map((c,i) => (
                    <tr key={i} style={{ borderTop:`1px solid ${C.border}`, background: c.status==="ok" ? "transparent" : "#2A1114" }}>
                      <td style={td}>{c.color || "—"}{c.code_from_name ? <span style={{ color:C.amber, fontSize:9, marginLeft:6 }} title="The COLOR CODE cell was blank: taken from the article name">FROM NAME</span> : null}</td>
                      <td style={{ ...td, fontWeight:600 }}>{c.size}</td>
                      <td style={mono}>{c.qty}</td>
                      <td style={mono}>{c.article || "—"}</td>
                      <td style={{ ...td, fontWeight:600, color: c.status==="ok" ? C.green : C.red }}>
                        {c.status==="ok" ? "✓ exists" : c.status==="generic" ? "✗ generic not in SAP" : c.status==="color" ? "✗ color not on the generic" : "✗ size not on this color"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {r.exists==="✓ EXISTS" && (
            <table>
              <thead><tr><th style={th}>SIZE</th><th style={th}>FILE QTY</th><th style={th}>SAP QTY</th>{hasS && <><th style={th}>ON HAND</th><th style={th}>ATS</th></>}<th style={th}></th><th style={th}>SAP COMPONENT ARTICLE</th><th style={th}>COLOR CODE</th><th style={th}>COLOR</th></tr></thead>
              <tbody>
                {sizes.map(sz => {
                  const c = sap[sz], f = file[sz], ok = c && String(c.qty)===String(f);
                  return (
                    <tr key={sz} style={{ borderTop:`1px solid ${C.border}`, background: ok ? "transparent" : "#2A1114" }}>
                      <td style={{ ...td, fontWeight:600 }}>{sz}</td>
                      <td style={mono}>{f ?? "—"}</td>
                      <td style={mono}>{c ? c.qty : "—"}</td>
                      {hasS && <><td style={{ ...mono, color: c && c.inv > 0 ? "#60A5FA" : C.sub }}>{c ? Number(c.inv||0).toLocaleString() : "—"}</td><td style={{ ...mono, color:C.sub }}>{c && c.ats != null ? Number(c.ats).toLocaleString() : "—"}</td></>}
                      <td style={{ ...td, color: ok ? C.green : C.red, fontWeight:700 }}>{ok ? "✓" : "✗"}</td>
                      <td style={mono}>{c ? c.article : "—"}</td>
                      <td style={td}>{c ? c.code : "—"}</td>
                      <td style={{ ...td, color:C.sub }}>{c ? c.color : "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    function BuysheetTab({ data, setData }) {
      const [file, setFile]         = useState(null);
      const [dragging, setDragging] = useState(false);
      const [loading, setLoading]   = useState(false);
      const [loadMsg, setLoadMsg]   = useState("");
      const [error, setError]       = useState(null);

      const onDrop = useCallback((e) => {
        e.preventDefault(); setDragging(false);
        const f = e.dataTransfer?.files[0] || e.target.files[0];
        if (f) { setFile(f); setError(null); }
      }, []);

      const [viewMode, setViewMode] = React.useState("GENERIC"); // "GENERIC" | "PPK"
      const [stock, setStock]         = React.useState(null);              // the SAP Cut and Sold export that is loaded on the server
      const [stockErr, setStockErr]     = React.useState("");
      const [stockBusy, setStockBusy]   = React.useState(false);
      const [liveView, setLiveView]   = React.useState(null);              // the HANA view live stock is read from (null = off)
      React.useEffect(() => { fetch(`${API}/stock`).then(r => r.json()).then(j => { setStock(j.stock || null); setLiveView(j.live || null); }).catch(() => {}); }, []);
      const live    = data?.summary?.stock?.source === "hana" ? data.summary.stock : null;
      const liveErr = data?.summary?.stock_error || "";
      const reloadValidation = async () => { const v = await fetch(`${API}/validation`); if (v.ok) setData(await v.json()); };
      const uploadStock = async (f) => {
        if (!f) return;
        setStockBusy(true); setStockErr("");
        try {
          const form = new FormData(); form.append("file", f);
          const res = await fetch(`${API}/stock`, { method:"POST", body:form });
          const j = await res.json(); if (!res.ok) throw new Error(j.error || "Could not read that file");
          setStock(j.stock);
          if (j.refreshed) await reloadValidation();
        } catch(e) { setStockErr(e.message); }
        finally { setStockBusy(false); }
      };
      const clearStock = async () => {
        setStockBusy(true); setStockErr("");
        try {
          const j = await (await fetch(`${API}/stock/clear`, { method:"POST" })).json();
          setStock(null); setFilter(f => f && f.key==="stock_check" ? null : f);
          if (j.refreshed) await reloadValidation();
        } catch(e) { setStockErr(e.message); }
        finally { setStockBusy(false); }
      };
      const hasStock = !!data?.summary?.stock;
      const [filter, setFilter] = React.useState(null);            // { scope, key, label }: show only rows where that check does not pass
      const [open, setOpen]     = React.useState({});              // prepack rows expanded to show their SAP components

      const validate = async () => {
        if (!file) return;
        setLoading(true); setError(null);
        const msgs = ["Parsing file…","Connecting to HANA…","Validating generics…","Validating PPKs…","Checking prices…","Done!"];
        let mi = 0; setLoadMsg(msgs[0]);
        const ticker = setInterval(()=>{ mi=(mi+1)%msgs.length; setLoadMsg(msgs[mi]); }, 1200);
        try {
          const form = new FormData(); form.append("file", file);
          const res = await fetch(`${API}/validate`, { method:"POST", body:form });
          if (!res.ok) throw new Error(await res.text());
          const d = await res.json();
          setData(d);
        } catch(err) { setError(err.message); }
        finally { clearInterval(ticker); setLoading(false); setLoadMsg(""); }
      };

      const download = async (endpoint, filename) => {
        setLoading(true); setLoadMsg("Preparing download…");
        try {
          const res = await fetch(`${API}/${endpoint}`);
          if (!res.ok) throw new Error(await res.text());
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href=url;
          a.download = filename.replace("DATE", new Date().toLocaleDateString("en-US").replace(/\//g,"-"));
          a.click();
        } catch(err) { setError(err.message); }
        finally { setLoading(false); setLoadMsg(""); }
      };

      const isHold  = data?.file_type === "hold_master";   // a hold master shows its two lists only (colors, stock), not the buysheet tables
      const rows    = [...(data?.generic||[]), ...(data?.ppk||[])];
      const missing = (data?.summary?.gen_missing||0) + (data?.summary?.ppk_missing||0);
      const canGen  = rows.length > 0;
      const gMiss   = (data?.generic||[]).filter(r=>r.status==="✗ MISSING");
      const ppkNeeds = (data?.ppk||[]).filter(r=>r.exists==="✗ MISSING" && r.readiness).flatMap(r=>r.readiness.needs.map(n=>({ ...n, article:r.ppk_article })));   // what missing prepacks need first
      const nNew    = new Set([...gMiss.filter(r=>r.missing_kind==="style").map(r=>r.style), ...ppkNeeds.filter(n=>n.kind==="generic").map(n=>n.style)]).size;
      const nAdd    = new Set([...gMiss.filter(r=>r.missing_kind!=="style").map(r=>r.style+"|"+r.color_code), ...ppkNeeds.filter(n=>n.kind!=="generic").map(n=>n.style+"|"+n.color)]).size;
      const nPpk    = data?.summary?.ppk_missing || 0;
      const todo    = [nNew && `${nNew} new style${nNew===1?"":"s"}`, nAdd && `${nAdd} color/size add${nAdd===1?"":"s"}`, nPpk && `${nPpk} prepack${nPpk===1?"":"s"}`].filter(Boolean).join(" · ");
      const genU      = data?.generic_unique || data?.generic || [];   // one entry per DISTINCT finding (the same result on many DATA rows is combined)
      const ppkU      = data?.ppk_unique || data?.ppk || [];
      const hasFineline = [...genU, ...ppkU].some(r => r.fineline_check && r.fineline_check !== "—");   // the buysheet has FINELINE values and HANA's column is set up
      const hasReady  = ppkU.some(r => r.ready_check && r.ready_check !== "—");     // some prepack is not in SAP: show whether it can be created yet
      const view      = (!genU.length && ppkU.length) ? "PPK" : viewMode;      // a prepack-only buysheet opens on PPK
      const failing   = (r, key) => { const v = String(r?.[key] ?? ""); return v.startsWith("✗") || v.startsWith("⚠") || v.startsWith("ℹ"); };
      const genBase   = genU.filter(r => !(filter && filter.scope==="gen") || failing(r, filter.key));
      const ppkBase   = ppkU.filter(r => !(filter && filter.scope==="ppk") || failing(r, filter.key));
      const money     = v => v ? `$${parseFloat(v).toFixed(2)}` : "—";
      // the numbers behind a check: shown on hover, so a matching price or description is just a check mark like the other columns
      const priceTip  = r => `Buy ${money(r.buy_price)}${r.currency ? " " + r.currency : ""} · SAP ${money(r.sap_price)}${r.price_source === "generic" ? " (the generic's price)" : ""}${r.price_trace ? "\n" + r.price_trace : ""}`;
      const msrpTip   = r => `Buy ${money(r.buy_msrp)} · SAP ${money(r.sap_msrp)}`;
      const descTip   = r => `Buy: ${r.buy_desc || "—"}\nSAP: ${r.sap_desc || "—"}${r.desc_note ? "\n" + r.desc_note : ""}`;
      const stockOf   = r => !r.stock ? "—" : r.stock.inv > 0 ? "in stock" : r.stock.other_total > 0 ? "other stock only" : "—";
      const genF = useColFilters(genBase, [
        { h:"Style", get:r=>r.style }, { h:"Code", get:r=>r.color_code }, { h:"Size", get:r=>r.size }, { h:"Status", get:r=>r.status }, { h:"Stock", get:stockOf },
        { h:"Fineline ✓", get:r=>chk(r.fineline_check) }, { h:"Color ✓", get:r=>chk(r.color_check) }, { h:"ZSLS ✓", get:r=>chk(r.price_check) }, { h:"ZVP1 ✓", get:r=>chk(r.msrp_check) }, { h:"Desc ✓", get:r=>chk(r.desc_check) }, { h:"Season ✓", get:r=>chk(r.season_check) }, { h:"PC/CTN ✓", get:r=>chk(r.pc_ctn_check) }, { h:"Rounding ✓", get:r=>chk(r.round_check) },
      ], data);
      const ppkF = useColFilters(ppkBase, [
        { h:"PPK Article", get:r=>r.ppk_article }, { h:"Code", get:r=>r.color_code }, { h:"Exists", get:r=>r.exists }, { h:"Can create", get:r=>r.readiness?.state || "—" }, { h:"Stock", get:stockOf },
        { h:"Fineline ✓", get:r=>chk(r.fineline_check) }, { h:"FILE sizes · ratio", get:r=>`${r.buy_sizes || "—"} ${r.buy_ratio || "—"}` }, { h:"SAP sizes · ratio", get:r=>`${r.sap_sizes || "—"} ${r.sap_ratio || "—"}` },
        { h:"Ratio ✓", get:r=>chk(r.ratio_check) }, { h:"Sizes ✓", get:r=>chk(r.sizes_check) }, { h:"PC/PPK ✓", get:r=>chk(r.pc_ppk_check) }, { h:"ZSLS ✓", get:r=>chk(r.price_check) }, { h:"ZVP1 ✓", get:r=>chk(r.msrp_check) }, { h:"Buy Color", get:r=>r.buy_color }, { h:"SAP Color", get:r=>r.sap_color },
        { h:"Color ✓", get:r=>chk(r.color_check) }, { h:"CC ✓", get:r=>chk(r.cc_check) }, { h:"Desc ✓", get:r=>chk(r.desc_check) }, { h:"Round ✓", get:r=>chk(r.round_check) },
      ], data);
      const genRows   = genF.shown;
      const ppkRows   = ppkF.shown;

      return (
        <div style={{ display:"flex", gap:24 }}>
          <div style={{ flex:1, minWidth:0 }}>
            {/* Upload */}
            <div onDrop={onDrop} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
              onClick={()=>document.getElementById("fi").click()}
              style={{ border:`1.5px dashed ${dragging?C.blue:C.border}`, borderRadius:10, padding:"32px 24px",
                textAlign:"center", cursor:"pointer", background:dragging?"#162840":C.card,
                marginBottom:20, transition:"all 0.2s" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>📂</div>
              {file
                ? <div><div style={{ fontWeight:600 }}>{file.name}</div><div style={{ color:C.sub, fontSize:12, marginTop:2 }}>{(file.size/1024).toFixed(1)} KB · Click to change</div></div>
                : <div><div style={{ fontWeight:500, marginBottom:2 }}>Drop file here</div><div style={{ color:C.sub, fontSize:12 }}>Prebuy or buysheet · .xlsx or .xlsm</div></div>}
              <input id="fi" type="file" accept=".xlsx,.xlsm" onChange={onDrop}/>
            </div>

            {error && <div style={{ marginBottom:14, padding:"10px 14px", background:"#3B0000", color:C.red, borderRadius:6, fontSize:13 }}>{error}</div>}

            {/* Step buttons in order */}
            <div style={{ display:"flex", gap:10, marginBottom:24, alignItems:"center" }}>
              {/* Step 1: Validate */}
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                <button onClick={validate} disabled={!file||loading}
                  style={{ padding:"10px 24px", background:file?C.blue:"#243450", color:"#fff",
                    border:"none", borderRadius:6, fontWeight:600, fontSize:14,
                    cursor:file?"pointer":"not-allowed", opacity:file?1:0.5 }}>
                  {loading && !rows.length ? loadMsg : "Validate →"}
                </button>
              </div>

              {/* Step 3 and 4 moved to dedicated tabs */}

            </div>

            {/* Summary cards */}
            {isHold && <HoldCheck data={data}/>}
            {data?.summary && !isHold && (
              <div style={{ display:"flex", gap:12, marginBottom:22, flexWrap:"wrap" }}>
                <StatCard label="OS EXISTS"   count={data.summary.gen_exists||0}  color={C.green} note="size rows in SAP"/>
                <StatCard label="OS MISSING"  count={data.summary.gen_missing||0} color={C.red} note="size rows to create"/>
                <StatCard label="PPK EXISTS"  count={data.summary.ppk_exists||0}  color={C.green} note="prepacks in SAP"/>
                <StatCard label="PPK MISSING" count={data.summary.ppk_missing||0} color={C.red} note="prepacks to create"/>
                <StatCard label="PPK ISSUES"  count={data.summary.ppk_issues||0}  color={C.amber} note="prepack rows with a ✗"/>
                <StatCard label="MULTI VALUES" count={new Set((data.consistency||[]).map(c=>c.style)).size} color={C.amber} note="styles with 2+ prices / finelines"/>
              </div>
            )}
            {!isHold && <ConsistencyPanel items={data?.consistency}/>}

            {data?.summary?.checks_gen && !isHold && <ValidationBoard data={data} filter={filter} setFilter={setFilter} setViewMode={setViewMode} onReport={()=>download("validation_report","Validation_DATE.xlsx")}/>}

            {missing > 0 && !isHold && (
              <div style={{ background:"#3B0000", border:`1px solid ${C.redD}`, borderRadius:8, padding:"12px 16px", marginBottom:18, fontSize:13, color:C.red }}>
                {todo} to create in SAP — see the SAP tab. The buysheet can still be generated.
              </div>
            )}

            {/* Results tables — GENERIC / PPK toggle */}
            {(genU.length > 0 || ppkU.length > 0) && !isHold && (
              <div>
                {((data.summary?.rows_os_checked||0) + (data.summary?.rows_ppk_checked||0)) > (genU.length + ppkU.length) && (
                  <div data-testid="dedupe-note" style={{ marginBottom:10, fontSize:11, color:C.sub }}>
                    {genU.length + ppkU.length} distinct checks from {(data.summary.rows_os_checked||0) + (data.summary.rows_ppk_checked||0)} DATA-sheet rows: identical results are combined.
                    Hover <span style={{ color:C.amber, fontWeight:700 }}>×N</span> to see which customers and deliveries share a result.
                  </div>
                )}
                {/* Sub-tab toggle */}
                <div style={{ display:"flex", gap:0, marginBottom:14, background:C.card,
                  border:`1px solid ${C.border}`, borderRadius:6, padding:3, width:"fit-content" }}>
                  {[["GENERIC",`OS (${genU.length})`],["PPK",`PPK (${ppkU.length})`]].map(([m,label])=>(
                    <button key={m} onClick={()=>{ setViewMode(m); setFilter(f => f && f.scope === (m==="GENERIC" ? "gen" : "ppk") ? f : null); }}
                      style={{ padding:"6px 18px", border:"none", borderRadius:4, fontSize:12, fontWeight:600,
                        cursor:"pointer", background: view===m ? C.steel : "none",
                        color: view===m ? "#fff" : C.sub }}>
                      {label}
                    </button>
                  ))}
                </div>

                {filter && (
                  <div data-testid="filter-banner" style={{ marginBottom:10, fontSize:12, color:C.amber }}>
                    Showing {filter.scope==="gen" ? genRows.length : ppkRows.length} of {filter.scope==="gen" ? genU.length : ppkU.length} {filter.key==="stock_check" ? "lines that are already in stock." : <span>lines where <b>{filter.label}</b> does not pass.</span>}
                  </div>
                )}
                {/* GENERIC table */}
                {view==="GENERIC" && (
                  <div style={{ background:C.card, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
                    <FilterBar F={genF} total={genBase.length}/>
                    <div className="tbl-scroll">
                      <table className="fit">
                        <thead>
                          <tr style={{ background:C.navy }}>
                            {["Style","Code","Size","Status",...(hasStock ? ["Stock"] : []),...(hasFineline ? ["Fineline ✓"] : []),"Color ✓","ZSLS ✓","ZVP1 ✓","Desc ✓","Season ✓","PC/CTN ✓","Rounding ✓"].map(h=>(
                              <FilterTh key={h} F={genF} h={h} style={{ padding:"8px 11px", color:C.sub, fontWeight:600, fontSize:10, whiteSpace:"nowrap" }}/>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {genRows.map((r,i)=>(
                            <tr key={i} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                              <td style={{ padding:"7px 11px", fontWeight:600, fontSize:12 }}>{r.style}<Repeats r={r}/></td>
                              <td style={{ padding:"7px 11px", color:C.sub, fontSize:12 }}>{r.color_code}</td>
                              <td style={{ padding:"7px 11px", fontSize:12 }}>{r.size}</td>
                              <td style={{ padding:"7px 11px" }} title={r.missing_reason || ""}><StatusPill status={r.status}/>{r.missing_kind ? <span style={{ color:C.sub, fontSize:9, marginLeft:6 }}>{({style:"NEW STYLE", color:"ADD COLOR", size:"ADD SIZE"})[r.missing_kind]}</span> : null}</td>
                              {hasStock && <td style={{ padding:"7px 11px" }}><StockCell r={r}/></td>}
                              {hasFineline && <td style={{ padding:"7px 11px" }} title={`buysheet ${r.buy_fineline || "—"} · SAP ${r.sap_fineline || "—"}`}><CheckPill val={r.fineline_check} tip={`buysheet ${r.buy_fineline || "—"} · SAP ${r.sap_fineline || "—"}`}/></td>}
                              <td style={{ padding:"7px 11px" }} title={r.color_note || (r.sap_color ? `SAP color: ${r.sap_color}` : "")}><CheckPill val={r.color_check} tip={r.color_note || (r.sap_color ? `SAP color: ${r.sap_color}` : "")}/></td>
                              <td style={{ padding:"7px 11px", cursor:"help" }} title={priceTip(r)}><CheckPill val={r.price_check} tip={priceTip(r)}/></td>
                              <td style={{ padding:"7px 11px", cursor:"help" }} title={msrpTip(r)}><CheckPill val={r.msrp_check} tip={msrpTip(r)}/></td>
                              <td style={{ padding:"7px 11px", cursor:"help" }} title={descTip(r)}><CheckPill val={r.desc_check} tip={descTip(r)}/></td>
                              <td style={{ padding:"7px 11px" }} title={`Buy: ${r.season || "—"} · SAP: ${r.sap_season || "not found"}`}><CheckPill val={r.season_check} tip={`Buy: ${r.season || "—"} · SAP: ${r.sap_season || "not found"}`}/></td>
                              <td style={{ padding:"7px 11px" }} title={r.pc_ctn_note || ""}><CheckPill val={r.pc_ctn_check} tip={r.pc_ctn_note || ""}/></td>
                              <td style={{ padding:"7px 11px" }}><CheckPill val={r.round_check}/></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* PPK table */}
                {view==="PPK" && (
                  <div style={{ background:C.card, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
                    {(() => {
                      const found = ppkU.filter(r=>r.exists==="✓ EXISTS");
                      const match = found.filter(r=>r.ratio_check==="✓" && r.sizes_check==="✓").length;
                      const diff  = found.filter(r=>String(r.ratio_check).startsWith("✗") || String(r.sizes_check).startsWith("✗")).length;
                      return (
                        <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`, display:"flex", gap:22, fontSize:12 }}>
                          <span style={{ color:C.green, fontWeight:600 }}>{match} ratio{match===1?"":"s"} match SAP</span>
                          <span style={{ color: diff ? C.red : C.sub, fontWeight:600 }}>{diff} differ</span>
                          <span style={{ color:C.sub }}>{ppkU.length - found.length} not in SAP (no ratio to compare)</span>
                        </div>
                      );
                    })()}
                    <FilterBar F={ppkF} total={ppkBase.length}/>
                    <div className="tbl-scroll">
                      <table className="fit">
                        <thead>
                          <tr style={{ background:C.navy }}>
                            {["PPK Article","Code","Exists",...(hasReady ? ["Can create"] : []),...(hasStock ? ["Stock"] : []),...(hasFineline ? ["Fineline ✓"] : []),"FILE sizes · ratio","SAP sizes · ratio","Ratio ✓","Sizes ✓","PC/PPK ✓","ZSLS ✓","ZVP1 ✓","Buy Color","SAP Color","Color ✓","CC ✓","Desc ✓","Round ✓"].map(h=>(
                              <FilterTh key={h} F={ppkF} h={h} style={{ padding:"8px 11px", color:C.sub, fontWeight:600, fontSize:10, whiteSpace:"nowrap" }}/>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {ppkRows.map((r,i)=>{
                            const rowKey = r.ppk_article + "|" + r.color_code;
                            const ratioOk = r.ratio_check==="✓" && r.sizes_check==="✓";
                            const ratioBad = String(r.ratio_check).startsWith("✗") || String(r.sizes_check).startsWith("✗");
                            const mono = { fontFamily:"ui-monospace, Menlo, Consolas, monospace", fontSize:11, whiteSpace:"nowrap" };
                            return (
                            <React.Fragment key={i}>
                            <tr data-testid="ppk-row" style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                              <td onClick={()=>setOpen(o=>({ ...o, [rowKey]: !o[rowKey] }))} title="Click to see the components SAP holds" style={{ padding:"7px 11px", fontWeight:600, fontSize:11, cursor:"pointer", whiteSpace:"nowrap" }}><span style={{ color:C.sub, marginRight:6 }}>{open[rowKey] ? "▾" : "▸"}</span>{r.ppk_article}{r.complex ? <span style={{ color:C.blue, fontSize:9, marginLeft:6 }}>COMPLEX</span> : null}<Repeats r={r}/></td>
                              <td style={{ padding:"7px 11px", color:C.sub, fontSize:11 }}>{r.color_code}</td>
                              <td style={{ padding:"7px 11px" }} title={r.match_note || ""}><StatusPill status={r.exists}/>{r.match_note && r.ppk_article !== r.prebuy_article ? <span style={{ color:C.sub, fontSize:9, marginLeft:6 }}>AS {r.ppk_article}</span> : null}</td>
                              {hasReady && (
                                <td data-testid="ready-cell" style={{ padding:"7px 11px", verticalAlign:"top", minWidth:240 }} title={r.readiness?.message || ""}>
                                  {r.readiness
                                    ? <div><CheckPill val={r.ready_check}/>{r.readiness.state==="blocked" ? <div style={{ color:C.red, fontSize:10, marginTop:3, maxWidth:260, whiteSpace:"normal", lineHeight:1.35 }}>{r.readiness.message}</div> : null}</div>
                                    : <span style={{ color:C.sub }}>—</span>}
                                </td>)}
                              {hasStock && <td style={{ padding:"7px 11px" }}><PpkStockCell r={r}/></td>}
                              {hasFineline && <td style={{ padding:"7px 11px" }} title={`buysheet ${r.buy_fineline || "—"} · SAP ${r.sap_fineline || "—"}`}><CheckPill val={r.fineline_check} tip={`buysheet ${r.buy_fineline || "—"} · SAP ${r.sap_fineline || "—"}`}/></td>}
                              <td style={{ padding:"7px 11px", ...mono }}>{r.buy_sizes || "—"}<br/><span style={{ color:C.sub }}>{r.buy_ratio || "—"}</span></td>
                              <td style={{ padding:"7px 11px", ...mono, background: ratioOk ? "#0F2A1A" : ratioBad ? "#3B0000" : "transparent" }} title={r.ratio_note || ""}>{r.sap_sizes || "—"}<br/><span style={{ color: ratioBad ? C.red : C.sub }}>{r.sap_ratio || "—"}</span></td>
                              <td style={{ padding:"7px 11px" }} title={r.ratio_note || ""}><CheckPill val={r.ratio_check} tip={r.ratio_note || ""}/>{r.ratio_note ? <div style={{ color:C.red, fontSize:10, marginTop:3, whiteSpace:"nowrap" }}>{r.ratio_note}</div> : null}</td>
                              <td style={{ padding:"7px 11px" }}><CheckPill val={r.sizes_check}/></td>
                              <td style={{ padding:"7px 11px" }}><CheckPill val={r.pc_ppk_check}/></td>
                              <td style={{ padding:"7px 11px", cursor:"help" }} title={priceTip(r)}><CheckPill val={r.price_check} tip={priceTip(r)}/></td>
                              <td style={{ padding:"7px 11px", cursor:"help" }} title={msrpTip(r)}><CheckPill val={r.msrp_check} tip={msrpTip(r)}/></td>
                              <td style={{ padding:"7px 11px", fontSize:10, color:C.sub }}>{r.buy_color}</td>
                              <td style={{ padding:"7px 11px", fontSize:10, color:C.sub }}>{r.sap_color}</td>
                              <td style={{ padding:"7px 11px" }} title={r.color_note || ""}><CheckPill val={r.color_check} tip={r.color_note || ""}/></td>
                              <td style={{ padding:"7px 11px" }}><CheckPill val={r.cc_check}/></td>
                              <td style={{ padding:"7px 11px" }} title={r.desc_note || ""}><CheckPill val={r.desc_check} tip={r.desc_note || ""}/></td>
                              <td style={{ padding:"7px 11px" }}><CheckPill val={r.round_check}/></td>
                            </tr>
                            {open[rowKey] && <tr><td colSpan={18} style={{ padding:0 }}><ComponentPanel r={r}/></td></tr>}
                            </React.Fragment>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function BuysheetsTab({ setData, goValidate }) {
      const [list, setList]   = React.useState(null);
      const [year, setYear]   = React.useState("");
      const [err, setErr]     = React.useState("");
      const [busy, setBusy]   = React.useState("");           // rel of the file being copied + validated
      const [find, setFind]   = React.useState("");
      const [reqs, setReqs]   = React.useState({});             // rel -> { customers, created }: read from the HEADER sheet's REQ# column
      const [pos, setPos]     = React.useState({});             // rel -> { customers, done, lines }: how many of each requisition's lines SAP has turned into POs
      const alive = React.useRef(true);
      React.useEffect(() => () => { alive.current = false; }, []);
      const loadPos = async (rels) => {
        try {
          const r = await fetch(`${API}/buysheets/pos`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ rels }) });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          const { _pending, ...got } = j;
          setPos(old => ({ ...old, ...got }));
        } catch (e) { setPos(old => ({ ...old, ...Object.fromEntries(rels.map(rel => [rel, { error:e.message }])) })); }
      };
      const loadReqs = async (j) => {
        const rels = j.quarters.flatMap(qt => qt.files.map(f => f.rel));
        while (alive.current) {
          try {
            const r = await fetch(`${API}/buysheets/reqs`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ rels }) });
            const { _pending, ...got } = await r.json();
            setReqs(old => ({ ...old, ...got }));
            if (!_pending) { loadPos(rels); return; }
          } catch (e) { return; }                                    // the list still works without it
          await new Promise(res => setTimeout(res, 3000));           // the server is still reading files: ask again
        }
      };
      const load = async (y, qtr) => {                          // only the chosen quarter's folder is read (the newest at first)
        setErr("");
        try {
          const r = await fetch(`${API}/buysheets/list?year=${encodeURIComponent(y || "")}&quarter=${encodeURIComponent(qtr || "")}`);
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          setList(j); setYear(j.year || ""); loadReqs(j);
        } catch (e) { setErr(e.message); }
      };
      React.useEffect(() => { load(""); }, []);
      const validate = async (rel) => {
        setBusy(rel); setErr("");
        try {
          const r = await fetch(`${API}/buysheets/validate`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ rel }) });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          setData(j); goValidate();
        } catch (e) { setErr(e.message); }
        setBusy("");
      };
      const q  = find.trim().toLowerCase();
      const reqCell = (rel) => {
        const x = reqs[rel];
        if (!x) return <span style={{ color:C.sub }}>…</span>;
        if (x.error) return <span style={{ color:C.red }} title={x.error}>?</span>;
        if (!x.customers) return <span style={{ color:C.sub }} title="No customer lines found on the HEADER sheet">—</span>;
        const color = x.created === x.customers ? C.green : x.created ? C.amber : C.red;
        return <span data-testid="reqs-cell" style={{ color, fontWeight:600, cursor:"help", whiteSpace:"nowrap" }} title={Object.entries(x.lines || {}).sort(([a],[b]) => a.localeCompare(b)).map(([c, r]) => `${c}: ${r || "no req yet"}`).join("\n")}>
          {x.created === x.customers ? "✓" : x.created ? "◐" : "✗"} {x.created}/{x.customers}</span>;
      };
      const reqDone = (rel) => reqs[rel]?.customers > 0 && reqs[rel].created === reqs[rel].customers;
      const poCell = (rel) => {
        const x = pos[rel];
        if (!x) return <span style={{ color:C.sub }}>…</span>;
        if (x.error) return <span style={{ color:C.red }} title={x.error}>?</span>;
        if (!x.customers) return <span style={{ color:C.sub }}>—</span>;
        const color = x.done === x.customers ? C.green : x.done ? C.amber : C.red;
        const tip = Object.entries(x.lines).sort(([a],[b]) => a.localeCompare(b)).map(([c, v]) =>
          !v.req ? `${c}: no req yet`
          : !v.lines ? `${c}: req ${v.req} not found in SAP`
          : v.with_po === v.lines ? `${c}: req ${v.req} · PO ${v.pos.join(", ")}`
          : v.with_po ? `${c}: req ${v.req} · ${v.with_po} of ${v.lines} lines have a PO (${v.pos.join(", ")})`
          : `${c}: req ${v.req} · no PO yet`).join("\n");
        return <span data-testid="pos-cell" style={{ color, fontWeight:600, cursor:"help", whiteSpace:"nowrap" }} title={tip}>
          {x.done === x.customers ? "✓" : x.done ? "◐" : "✗"} {x.done}/{x.customers}</span>;
      };
      const poDone = (rel) => pos[rel]?.customers > 0 && pos[rel].done === pos[rel].customers;
      const th = { padding:"8px 11px", textAlign:"left", color:C.sub, fontSize:10, fontWeight:600, letterSpacing:1, borderBottom:`1px solid ${C.border}` };
      const td = { padding:"7px 11px", fontSize:12, borderBottom:`1px solid ${C.border}` };
      return (
        <div>
          <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:12, flexWrap:"wrap" }}>
            {list?.years?.length > 1 && (
              <select value={year} onChange={e => load(e.target.value, "")} style={{ background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:6, padding:"6px 8px" }}>
                {list.years.map(y => <option key={y}>{y}</option>)}
              </select>
            )}
            {list?.quarter_names?.length > 0 && (
              <select value={list.quarter} onChange={e => load(year, e.target.value)} style={{ background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:6, padding:"6px 8px" }}>
                {list.quarter_names.map(q => <option key={q} value={q}>{q}</option>)}
              </select>
            )}
            <input value={find} onChange={e => setFind(e.target.value)} placeholder="Filter by name…"
              style={{ background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:6, padding:"6px 10px", fontSize:12, width:220 }}/>
            <button onClick={() => load(year, list?.quarter)} style={{ padding:"6px 12px", background:"none", color:C.text, border:`1px solid ${C.border}`, borderRadius:6, fontSize:12, cursor:"pointer" }}>↻ Refresh list</button>
          </div>
          {err && <div style={{ color:C.red, fontSize:12, marginBottom:10 }}>{err}</div>}
          {!list && !err && <div style={{ color:C.sub }}>Reading the share…</div>}
          {list?.quarters.map(qt => {
            const files = qt.files.filter(f => !q || f.name.toLowerCase().includes(q));
            const done  = qt.files.filter(f => reqDone(f.rel) && poDone(f.rel)).length;
            return (
              <div key={qt.quarter} style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, marginBottom:14, overflow:"hidden" }}>
                <div style={{ padding:"10px 14px", fontWeight:700, display:"flex", justifyContent:"space-between" }}>
                  <span>{qt.quarter}</span>
                  <span style={{ color:C.sub, fontSize:11, fontWeight:500 }}>{qt.files.length} buysheets · {done} fully done</span>
                </div>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr>
                    <th style={th}>BUYSHEET (click to validate)</th><th style={th}>MODIFIED</th><th style={th} title="Customer lines with a REQ# on the HEADER sheet">REQS CREATED</th><th style={th} title="Requisition lines that SAP has turned into purchase orders, per customer line">POS CREATED</th>
                  </tr></thead>
                  <tbody>
                    {files.map(f => (
                      <tr key={f.rel}>
                        <td style={td}>
                          <span onClick={() => !busy && validate(f.rel)} style={{ color:C.blue, cursor:busy ? "wait" : "pointer", textDecoration:"underline" }}>{f.name}</span>
                          {busy === f.rel && <span style={{ color:C.amber, marginLeft:10 }}>copying + validating…</span>}
                        </td>
                        <td style={{ ...td, color:C.sub }}>{f.modified}</td>
                        <td style={td}>{reqCell(f.rel)}</td>
                        <td style={td}>{poCell(f.rel)}</td>
                      </tr>
                    ))}
                    {!files.length && <tr><td style={{ ...td, color:C.sub }} colSpan={4}>No buysheets{q ? " match the filter" : ""}.</td></tr>}
                  </tbody>
                </table>
              </div>
            );
          })}
        </div>
      );
    }

    function SapTab({ data, setData }) {
      const [tplBusy, setTplBusy] = React.useState(false);
      const [tplErr, setTplErr]   = React.useState("");
      const reloadFromServer = async () => { const j = await (await fetch(`${API}/validation`)).json(); if (!j.error && setData) setData(j); };
      const getTemplates = async () => {
        setTplBusy(true); setTplErr("");
        try {
          const res = await fetch(`${API}/creation_templates?refresh=1`);      // checks SAP again first, so new variants are in the file
          if (!res.ok) throw new Error(await res.text());
          const url = URL.createObjectURL(await res.blob());
          const a = document.createElement("a"); a.href = url;
          a.download = `Creation_Templates_${new Date().toLocaleDateString("en-US").replace(/\//g,"-")}.xlsx`; a.click();
          await reloadFromServer();
        } catch (e) { setTplErr(e.message); }
        setTplBusy(false);
      };
      const genRows = data?.generic || [];
      const ppkRows = data?.ppk || [];
      const uniq   = (arr, key) => [...new Map(arr.map(r=>[key(r), r])).values()];
      const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;

      // Rows that are not in SAP, split by WHAT is missing: a whole style, or a color / size on a style SAP already has
      const missing   = genRows.filter(r=>r.status==="✗ MISSING");
      const newStyles = [...missing.filter(r=>r.missing_kind==="style").reduce((m, r)=>{
        const e = m.get(r.style) || { style:r.style, colors:[], reason:r.missing_reason };
        if (!e.colors.includes(r.color_code)) e.colors.push(r.color_code);
        return m.set(r.style, e);
      }, new Map()).values()].map(e=>({ ...e, detail:`${plural(e.colors.length, "color")}: ${e.colors.join(", ")}` }));
      const adds = [...missing.filter(r=>r.missing_kind!=="style").reduce((m, r)=>{
        const k = r.style+"|"+r.color_code;
        const e = m.get(k) || { style:r.style, color_code:r.color_code, buy_color:r.buy_color, kind:r.missing_kind, code_in_sap:r.code_in_sap, sizes:[], reason:r.missing_reason };
        e.sizes.push(r.size);
        return m.set(k, e);
      }, new Map()).values()].map(e=>({ ...e, detail: e.kind==="color"
        ? `new color on this style${e.code_in_sap ? " (code already in SAP)" : " (code not on any article yet)"}`
        : `missing ${e.sizes.length===1 ? "size" : "sizes"}: ${e.sizes.join(", ")}` }));
      // What a missing PREPACK needs first (its generic, a color on it, or sizes of a color) joins what open-stock lines need,
      // so a generic or a color is listed once, with the prepack(s) that need it.
      const sizesText = e => e.sizes && e.sizes.length ? `${e.sizes.length===1 ? "size" : "sizes"} ${e.sizes.join(", ")}` : "";
      ppkRows.filter(r=>r.exists==="✗ MISSING" && r.readiness).forEach(r => r.readiness.needs.forEach(n => {
        if (n.kind === "generic") {
          let e = newStyles.find(x => x.style === n.style);
          if (!e) { e = { style:n.style, colors:[], reason:"" }; newStyles.push(e); }
          if (n.color && !e.colors.includes(n.color)) e.colors.push(n.color);
          e.sizes = [...new Set([...(e.sizes||[]), ...n.sizes])];
          e.needed_by = [...new Set([...(e.needed_by||[]), r.ppk_article])];
        } else {
          let e = adds.find(x => x.style === n.style && x.color_code === n.color);
          if (!e) { e = { style:n.style, color_code:n.color, buy_color:n.color_name, kind:n.kind, sizes:[], reason:"" }; adds.push(e); }
          n.sizes.forEach(z => { if (!e.sizes.includes(z)) e.sizes.push(z); });
          e.needed_by = [...new Set([...(e.needed_by||[]), r.ppk_article])];
        }
      }));
      newStyles.forEach(e => { if (e.needed_by) { e.detail = `${plural(e.colors.length, "color")}: ${e.colors.join(", ")}${sizesText(e) ? " · " + sizesText(e) : ""}`; e.reason = e.reason || `needed by prepack ${e.needed_by.join(", ")}`; } });
      adds.forEach(e => { if (e.needed_by) { e.detail = `${e.kind==="color" ? "new color on this style" : "missing " + sizesText(e)}${e.kind==="color" && sizesText(e) ? " (" + sizesText(e) + ")" : ""}`; e.reason = e.reason || `needed by prepack ${e.needed_by.join(", ")}`; } });
      const colorIssues = uniq([...genRows,...ppkRows].filter(r=>r.color_check && r.color_check.startsWith("✗")), r=>(r.style||r.ppk_article)+"|"+r.color_code)
                            .map(r=>({ ...r, detail:r.color_check, reason:r.color_note||"" }));
      const descIssues  = uniq([...genRows,...ppkRows].filter(r=>r.desc_check && r.desc_check.startsWith("✗")), r=>(r.style||r.ppk_article))
                            .map(r=>({ style:r.style, ppk_article:r.ppk_article,
                                       detail:`file "${r.buy_desc||""}" → SAP "${r.sap_desc||""}"${r.desc_note ? ` (${r.desc_note})` : ""}`,
                                       reason:r.desc_note||"" }));
      const missingPPKs = [...ppkRows.filter(r=>r.exists==="✗ MISSING").reduce((m, r)=>{
        const e = m.get(r.ppk_article) || { ...r, colors:[], buy_color:"", color_code:"" };
        e.colors.push(r.color_code); return m.set(r.ppk_article, e);
      }, new Map()).values()].map(e=>({ ...e, detail: [e.complex ? `complex prepack, ${e.colors.length} colors: ${e.colors.join(", ")}` : "prepack not in SAP", e.readiness ? (e.readiness.state==="ready" ? "ready to create now" : `blocked: ${e.readiness.message}`) : ""].filter(Boolean).join(" · "), reason: e.readiness ? e.readiness.message : "" }));

      // ONE list of everything to create or fix, each line tagged with its type
      const acTypes = [
        { label:"New generic",  color:C.red,   items:newStyles,   sub:"styles not in SAP: create the generic" },
        { label:"Add to style", color:C.amber, items:adds,        sub:"colors or sizes to add to styles already in SAP" },
        { label:"Color differs", color:C.amber, items:colorIssues, sub:"color descriptions that differ from SAP" },
        { label:"Description differs", color:C.amber, items:descIssues, sub:"style descriptions that differ from SAP" },
        { label:"Prepack",      color:C.red,   items:missingPPKs, sub:"prepacks not in SAP" },
      ];
      const acRows = acTypes.flatMap(t => t.items.map(r => ({
        type:t.label, color:t.color, style:r.style||r.ppk_article, color_code:r.color_code||(r.colors||[]).join(" "), buy_color:r.buy_color||"",
        detail:r.detail||"", reason:r.reason||"", ready: t.label==="Prepack" ? (r.readiness?.state || "—") : "—" })));
      const acF = useColFilters(acRows, [
        { h:"Type", get:r=>r.type }, { h:"Article", get:r=>r.style }, { h:"Code", get:r=>r.color_code }, { h:"Color", get:r=>r.buy_color },
        { h:"Detail", get:r=>r.detail }, { h:"Ready", get:r=>r.ready },
      ], data);

      // What stops creation: prepacks that are blocked, and color / description differences from SAP. (New generics and adds are things to CREATE, not errors.)
      const blockers = acRows.filter(r => r.type==="Color differs" || r.type==="Description differs" || (r.type==="Prepack" && r.ready==="blocked"));
      const emailBlockers = () => {
        const file = data?.filename || "the prebuy";
        const lines = blockers.map((r, i) => `${i+1}. ${r.type}: ${[r.style, r.color_code, r.buy_color].filter(Boolean).join(" ")} - ${r.reason || r.detail}`);
        const NL = "\n";
        const body = ["Hi,", "", `These items on ${file}${data?.customers?.length ? ` (${data.customers.join(", ")})` : ""} need attention before the articles can be created:`, "", ...lines, "", "Thanks"].join(NL);
        const subject = `${file}: ${blockers.length} item${blockers.length===1?"":"s"} blocking article creation`;
        try { navigator.clipboard.writeText(body); } catch (e) {}                      // the full text is always on the clipboard: a mail link can be cut short
        const MAX = 1500;                                                              // Outlook and others drop a mailto link much longer than this
        const shown = body.length > MAX ? body.slice(0, body.lastIndexOf(NL, MAX)) + NL + NL + "(list shortened here: the full list is on your clipboard, paste it over this)" : body;
        window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shown)}`;
      };

      if (!genRows.length && !ppkRows.length) return (
        <div style={{ textAlign:"center", padding:"80px 0", color:C.sub }}>
          <div style={{ fontSize:32, marginBottom:12 }}>📋</div>
          <div style={{ fontSize:16, fontWeight:500, marginBottom:6 }}>No validation data yet</div>
          <div style={{ fontSize:13 }}>Run validation on the VALIDATION tab first</div>
        </div>
      );

      return (
        <div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
            {acTypes.map(t => {
              const n = acRows.filter(r=>r.type===t.label).length;
              const only = acF.f.Type && acF.f.Type.size===1 && acF.f.Type.has(t.label);
              return (
                <button key={t.label} disabled={!n} onClick={()=>acF.set("Type", only ? null : new Set([t.label]))} title={t.sub}
                  style={{ display:"flex", gap:8, alignItems:"center", padding:"5px 11px", borderRadius:6, fontSize:11, cursor: n ? "pointer" : "default", background: only ? "#243450" : "#111B2B", border:`1px solid ${only ? C.blue : (n ? t.color : C.border)}`, color:C.text }}>
                  <span style={{ fontWeight:600 }}>{t.label}</span><span style={{ color: n ? t.color : C.green, fontWeight:700 }}>{n}</span>
                </button>);
            })}
            <div style={{ flex:1 }}/>
            <button data-testid="email-blockers" onClick={emailBlockers} disabled={!blockers.length}
              title="Opens an email draft in your mail program listing everything that blocks creation. Nothing is sent."
              style={{ padding:"7px 16px", background:"none", color: blockers.length ? C.amber : C.sub, border:`1px solid ${blockers.length ? C.amber : C.border}`, borderRadius:5, fontSize:12, fontWeight:600, cursor: blockers.length ? "pointer" : "default" }}>Email blockers ({blockers.length}) &#9993;</button>
            <button data-testid="creation-templates" onClick={getTemplates} disabled={tplBusy}
              title="GENERIC CREATION (new styles), PPK CREATION and COLOR ADD (new colors / sizes on styles SAP has), in the layout the creation scripts read."
              style={{ padding:"7px 16px", background:"#92400E", color:"#fff", border:"none", borderRadius:5, fontSize:12, fontWeight:600, cursor:"pointer" }}>{tplBusy ? "Preparing…" : "Get Creation Templates →"}</button>
          </div>
          {tplErr && <div style={{ marginBottom:12, padding:"8px 12px", background:"#3B0000", color:C.red, borderRadius:6, fontSize:12 }}>{tplErr}</div>}
          <div style={{ background:C.card, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
            <FilterBar F={acF} total={acRows.length}/>
            {!acRows.length
              ? <div style={{ padding:"28px 0", textAlign:"center", color:C.green, fontSize:13 }}>Nothing to create or fix. All clear!</div>
              : <div className="tbl-scroll">
                  <table>
                    <thead><tr style={{ background:C.navy, position:"sticky", top:0 }}>
                      {["Type","Article","Code","Color","Detail","Ready"].map(h=><FilterTh key={h} F={acF} h={h} style={{ padding:"8px 11px", color:C.sub, fontWeight:600, fontSize:10, whiteSpace:"nowrap", textAlign:"left" }}/>)}
                    </tr></thead>
                    <tbody>
                      {acF.shown.map((r,i)=>(
                        <tr key={i} title={r.reason||""} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                          <td style={{ padding:"6px 11px", fontSize:10, fontWeight:700, whiteSpace:"nowrap", color:r.color }}>{r.type}</td>
                          <td style={{ padding:"6px 11px", fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>{r.style}</td>
                          <td style={{ padding:"6px 11px", fontSize:11, color:C.sub }}>{r.color_code}</td>
                          <td style={{ padding:"6px 11px", fontSize:11, color:C.sub, whiteSpace:"nowrap" }}>{r.buy_color}</td>
                          <td style={{ padding:"6px 11px", fontSize:11, color:C.sub, maxWidth:520, whiteSpace:"normal", lineHeight:1.35 }}>{r.detail}</td>
                          <td style={{ padding:"6px 11px", fontSize:11, whiteSpace:"nowrap", color: r.ready==="ready" ? C.green : r.ready==="blocked" ? C.red : C.sub }}>{r.ready}</td>
                        </tr>))}
                    </tbody>
                  </table>
                </div>}
          </div>
          <GenericRunner ready={newStyles.length}/>
          <PpkRunner ready={missingPPKs.filter(e=>e.readiness?.state==="ready").length}/>
          <div style={{ marginTop:28, background:C.card, border:`1px dashed ${C.border}`, borderRadius:8, padding:"20px 24px" }}>
            <div style={{ color:C.sub, fontSize:11, fontWeight:600, letterSpacing:1, marginBottom:8 }}>PRICING (ZVP1 · ZSLS · PR00)</div>
            <div style={{ color:C.sub, fontSize:12 }}>Coming soon. The PRICING tab of the creation template already has the columns; the scripts will run from here.</div>
          </div>
        </div>
      );
    }

    // Runs tools/_sap_generic_creation.py (MM41 by screen coordinates) from the creation template of the loaded file.

          {err && <div style={{ color:C.red, fontSize:12, marginTop:10 }}>{err}</div>}

              </div>
              <pre style={{ margin:0, maxHeight:220, overflow:"auto", background:"#0003", border:`1px solid ${C.border}`, borderRadius:5, padding:10, fontSize:11, color:C.text }}>{st.log || "(no output yet)"}</pre>
            </div>

    function DeliveryFlowTab() {
      const [mode, setMode]       = React.useState("manual"); // "manual" | "file"
      const [splitType, setSplitType] = React.useState("OS"); // "OS" | "PPK"
      const blank = () => ({ customer:"", style:"", color:"", ratio:"", qty:"" });
      const [lines, setLines]     = React.useState([blank()]);
      const [del1, setDel1]       = React.useState("");
      const [del2, setDel2]       = React.useState("");
      const [del1Date, setDel1Date] = React.useState("");
      const [del2Date, setDel2Date] = React.useState("");
      const [splitBy, setSplitBy]   = React.useState("all");     // "all": one Del 1 / Del 2 across the whole buysheet (usual) | "customer": one pair per customer
      const [custDel, setCustDel]   = React.useState({});        // customer -> { d1, date1, d2, date2 }
      const custNames = [...new Set(lines.map(l => l.customer.trim().toUpperCase()).filter(Boolean))];
      const setCust = (c, f, v) => setCustDel(o => ({ ...o, [c]: { ...(o[c] || {}), [f]: v } }));
      const [file, setFile]       = React.useState(null);
      const [results, setResults] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [error, setError]     = React.useState("");
      const [flowReport, setFlowReport] = React.useState(null);     // the result of splitting the validated buysheet along a delivery-flow file

      const addLine    = () => setLines([...lines, blank()]);
      const removeLine = (i) => setLines(lines.length > 1 ? lines.filter((_,li)=>li!==i) : [blank()]);
      const updateLine = (i, field, val) => setLines(lines.map((l,li)=> li===i ? { ...l, [field]:val } : l));

      // one line's total split proportionally; prepacks are split in WHOLE PACKS so each delivery ships complete packs
      const splitLine = (l, prop) => {
        const qty  = parseInt(l.qty, 10);
        const rsum = splitType==="PPK" ? l.ratio.split(/[-\s,]+/).filter(Boolean).reduce((a,b)=>a+(parseInt(b,10)||0),0) : 0;
        if (splitType==="PPK" && rsum) {
          const packs = qty / rsum;
          const p1 = Math.round(packs*prop);
          return { packs, p1, p2: packs - p1, d1: p1*rsum, d2: qty - p1*rsum, whole: Number.isInteger(packs) };
        }
        const d1 = Math.round(qty*prop);
        return { packs:null, d1, d2: qty - d1, whole:true };
      };

      const calculate = () => {
        setError(""); setResults(null);
        const used = lines.filter(l => l.customer || l.style || l.color || l.qty);
        const rows = [], problems = [], notes = [], dels = {};
        // the delivery quantities typed: one pair for the whole buysheet, or one pair per customer
        if (splitBy === "all") {
          const d1 = parseInt(del1, 10), d2 = parseInt(del2, 10);
          if (!d1 || !d2) { setError("Enter both delivery quantities"); return; }
          dels["*"] = { d1, d2, date1:del1Date, date2:del2Date };
        } else {
          custNames.forEach(c => {
            const v = custDel[c] || {}, d1 = parseInt(v.d1, 10), d2 = parseInt(v.d2, 10);
            if (!d1 || !d2) problems.push(`${c}: enter both delivery quantities`);
            else dels[c] = { d1, d2, date1:v.date1 || "", date2:v.date2 || "" };
          });
        }
        used.forEach(l => {
          const n = `Line ${lines.indexOf(l) + 1}`;
          if (!l.customer.trim()) { problems.push(`${n}: customer is required`); return; }
          if (!l.style || !l.qty) { problems.push(`${n}: style and total qty are required`); return; }
          if (!/^\d+$/.test(String(l.qty).trim())) { problems.push(`${n}: total qty must be a whole number`); return; }
          if (splitType==="PPK" && !l.ratio) { problems.push(`${n}: a prepack needs its ratio`); return; }
          const cust = l.customer.trim().toUpperCase(), dd = dels[splitBy === "all" ? "*" : cust];
          if (!dd) return;
          const sp = splitLine(l, dd.d1 / (dd.d1 + dd.d2));
          if (!sp.whole) problems.push(`${n}: ${l.qty} pieces is not a whole number of packs (ratio totals ${l.qty/sp.packs})`);
          rows.push({ customer:cust, style:l.style.trim().toUpperCase(), color:l.color.trim().toUpperCase(), ratio:l.ratio.trim(), qty:parseInt(l.qty,10), ...sp, date1:dd.date1, date2:dd.date2 });
        });
        if (problems.length) { setError(problems.join("  ·  ")); return; }
        if (!rows.length) { setError("Add at least one line"); return; }
        if (splitBy === "customer") rows.sort((a, b) => a.customer.localeCompare(b.customer));
        // warn (not block) when the typed delivery quantities do not add up to the lines they split
        Object.entries(dels).forEach(([k, dd]) => {
          const sum = rows.filter(r => k === "*" || r.customer === k).reduce((a, r) => a + r.qty, 0);
          if (sum !== dd.d1 + dd.d2) notes.push(`${k === "*" ? "Whole buysheet" : k}: the lines total ${sum.toLocaleString()} but Del 1 + Del 2 is ${(dd.d1 + dd.d2).toLocaleString()}`);
        });
        setResults({ rows, notes, splitBy, del1Date, del2Date });
      };

      const splitFromFlow = async () => {
        if (!file) return;
        setError(""); setFlowReport(null); setLoading(true);
        try {
          const form = new FormData(); form.append("file", file);
          const res = await fetch(`${API}/delivery_flow/preview`, { method:"POST", body:form });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || "The split failed");

      const downloadSplit = () => { const a = document.createElement("a"); a.href = `${API}/delivery_flow/download`; a.click(); };

        const body = results.rows.map(r => PPK ? [r.customer,r.style,r.color,r.ratio,r.qty,r.packs,r.d1,r.p1,r.date1,r.d2,r.p2,r.date2] : [r.customer,r.style,r.color,r.qty,r.d1,r.date1,r.d2,r.date2]);
        navigator.clipboard && navigator.clipboard.writeText([head, ...body].map(r=>r.join("\t")).join("\n"));
      };

      const inputStyle = { padding:"9px 14px", background:C.card, border:`1px solid ${C.border}`,

      const fields = splitType==="PPK"

      const grid = splitType==="PPK" ? "1.2fr 1.5fr 1.5fr 1fr 1fr auto" : "1.2fr 1.5fr 1.5fr 1fr auto";

      const rHead = splitType==="PPK" ? ["CUSTOMER","STYLE","COLOR","RATIO","TOTAL","PACKS",dl(1,wholeSplit && results?.del1Date),dl(2,wholeSplit && results?.del2Date)] : ["CUSTOMER","STYLE","COLOR","TOTAL",dl(1,wholeSplit && results?.del1Date),dl(2,wholeSplit && results?.del2Date)];

          {/* Manual mode */}

        function BuysheetDataTab({ data }) {
      const [loading, setLoading] = React.useState(false);

      if (!rows.length) return (
        <div style={{ textAlign:"center", padding:"80px 0", color:C.sub }}>

          <div style={{ fontSize:13 }}>Run validation on the VALIDATION tab first</div>

      return (
        <div>
          <div style={{ marginBottom:24 }}>
            <div style={{ fontSize:16, fontWeight:600, marginBottom:4 }}>Create Buysheet</div>
            <div style={{ color:C.sub, fontSize:13 }}>{(data?.summary?.total_os||0)+(data?.summary?.total_ppk||0)} rows · {data?.customers?.join(", ")}</div>
          </div>

          {missing > 0 && (
            <div style={{ background:"#2D1B00", border:`1px solid ${C.amber}`, borderRadius:8,
              padding:"12px 16px", marginBottom:20, fontSize:13, color:C.amber }}>
              {missing} article line{missing===1?"":"s"} not in SAP yet (see the SAP tab). The buysheet includes them; create them before the PR file.
            </div>
          )}

          <div style={{ display:"flex", gap:14, marginBottom:28, flexWrap:"wrap" }}>
            {[
              ["OS EXISTS",  data?.summary?.gen_exists||0, C.green],
              ["PPK EXISTS", data?.summary?.ppk_exists||0, C.green],
              ["MISSING",    missing,                      C.red],
              ["PPK ISSUES", data?.summary?.ppk_issues||0, C.amber],

              <div key={label} style={{ background:C.card, border:`1px solid ${C.border}`,
                borderRadius:8, padding:"16px 22px", minWidth:140 }}>

                <div style={{ fontSize:28, fontWeight:700, color: count>0?color:C.green, marginTop:4 }}>{count}</div>

        try {

          if (!r.ok) throw new Error(j.error || "The ItemHub pull failed");

        finally { setLpBusy(false); }

      const check = async () => {
        setBusy(true); setErr("");

          if (!r.ok) throw new Error(j.error || "The check failed");

        setBusy(true); setErr(""); setRes(null); setName(f.name);
        try {

      const onDropFile = (e) => { e.preventDefault(); setDrag(false); run(e.dataTransfer?.files[0] || e.target.files?.[0]); if (e.target.value) e.target.value = ""; };

            <button onClick={load} disabled={busy} style={{ background:"none", border:`1px solid ${C.border}`, color:C.sub, borderRadius:5, padding:"6px 10px", fontSize:11, cursor:"pointer" }}>Refresh</button>

          </div>

    function PoCheckTab({ saved, setSaved }) {

          const r = await fetch(`${API}/lookup?q=${encodeURIComponent(q.trim())}`);
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || "Lookup failed");
          setRes(j); setOpen({});

          if (!r.ok) throw new Error(j.error || "Margin file could not be read");
          setMargin(j); if (q.trim() && res) lookup();
        } catch (e) { setErr(e.message); }

        { h:"", get:it=>({ error:"✗ errors", warn:"! warnings", ok:"✓ clean" })[worst(it)] },
        { h:"PO / item", get:it=>it.po ? `${it.po} / ${it.po_item}` : "-" }, { h:"Req / item", get:it=>it.req ? `${it.req} / ${it.req_item}` : "-" },
        { h:"Article", get:it=>it.article }, { h:"Req pc", get:it=>fmtN(it.req_qty_pc,0) }, { h:"PO pc", get:it=>fmtN(it.po_qty_pc,0) },

      ], res);

                                  {kv("Dispatch / trading ctry", `${it.dispatch} / ${it.trading}`)}
                                  {kv("Fiber (SAP)", it.fiber)}
                                  {it.set_components.length>0 && kv("Set components", it.set_components.map(c=>`${c.code||"(blank)"} ${c.desc} fob ${c.fob ?? ""} 1st ${c.first_sale ?? ""}`).join(" | "))}
                                </div>
                                <div>
                                  <div style={{ color:C.sub, fontSize:11, marginBottom:4 }}>DELIVERY SCHEDULE</div>
                                  {it.sched.length ? it.sched.map(s=><div key={s.line} style={{ fontSize:12 }}>line {s.line}: {fmtN(s.qty_pc,0)} pc · ex-factory {fmtD(s.ex_factory)} · ETD {fmtD(s.etd)} · ETA {fmtD(s.eta)} · delivery {fmtD(s.delivery)}</div>) : <div style={{ fontSize:12, color:C.amber }}>no schedule line</div>}
                                </div>
                                {it.margin?.rows>0 && (
                                  <div>
                                    <div style={{ color:C.sub, fontSize:11, marginBottom:4 }}>MARGIN FILE ({it.margin.rows} rows, sheet rows {it.margin.rows_at?.join(", ")})</div>
                                    {kv("FINAL PO FOB", it.margin.fob?.join(", "))}
                                    {kv("Term", it.margin.term?.join(", "))}
                                    {kv("First sale", it.margin.first_sale?.join(", "))}
                                    {kv("Duty rate", it.margin.duty_rate?.join(", "))}
                                    {kv("COO", it.margin.coo?.join(", "))}
                                    {kv("Fabrication", it.margin.fabrication?.join(" | "))}
                                    {it.margin.qty!==undefined && kv("Style qty", fmtN(it.margin.qty,0))}
                                  </div>
                                )}
                              </div>
                            </td></tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
          {!res && !err && <div style={{ textAlign:"center", padding:"60px 0", color:C.sub, fontSize:13 }}>Enter a PO or requisition number to pull both from SAP and compare them. If a buysheet is loaded on the VALIDATION tab, its requisitions (REQ# on the HEADER sheet, one per customer) are checked line by line too.</div>}
        </div>
      );
    }

    function HistoryTab() {
      return (
        <div style={{ textAlign:"center", padding:"80px 0", color:C.sub }}>
          <div style={{ fontSize:32, marginBottom:12 }}>🕒</div>
          <div style={{ fontSize:16, fontWeight:500, marginBottom:6 }}>History coming soon</div>
          <div style={{ fontSize:13 }}>Past validation runs will appear here</div>
        </div>
      );
    }

    function App() {
      const [tab, setTab]   = useState("Validation");
      const [data, setData] = useState(null);
      const [chk, setChk]   = useState(null);     // PO CHECK tab keeps its last lookup while you visit other tabs
      const [lp, setLp]     = useState(null);     // ITEMHUB tab keeps its last check
      const [serverBuild, setServerBuild] = useState(undefined);   // undefined = still asking
      React.useEffect(() => {
        fetch(`${API}/health`).then(r=>r.json()).then(j=>setServerBuild(j.build || null)).catch(()=>setServerBuild("unreachable"));
      }, []);
      const buildMismatch = serverBuild !== undefined && serverBuild !== PAGE_BUILD;
      const [refBusy, setRefBusy] = React.useState(false);
      const [refAt, setRefAt]     = React.useState("");
      const [refErr, setRefErr]   = React.useState("");
      const refreshAll = async () => {                      // every check against SAP again, for the file that is loaded (no re-drop)
        setRefBusy(true); setRefErr("");
        try {
          const res = await fetch(`${API}/revalidate`, { method:"POST" });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || "Refresh failed");
          setData(j); setRefAt(new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }));
        } catch (e) { setRefErr(e.message); }
        setRefBusy(false);
      };
      const nOS  = data?.summary?.total_os  || 0;
      const nPPK = data?.summary?.total_ppk || 0;

      return (
        <div style={{ minHeight:"100vh", background:C.bg }}>
          {/* Header */}
          <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"12px 16px",
            display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <div data-testid="brand" style={{ display:"flex", alignItems:"center", gap:14 }}>
                <svg width="54" height="54" viewBox="0 0 64 64" role="img" aria-label="SightLine">
                  <defs>
                    <linearGradient id="hsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#3B82F6"/><stop offset="1" stopColor="#22D3EE"/></linearGradient>
                    <radialGradient id="hsi" cx="50%" cy="50%" r="50%"><stop offset="0" stopColor="#E8FBFF"/><stop offset=".45" stopColor="#22D3EE"/><stop offset="1" stopColor="#1D4ED8"/></radialGradient>
                  </defs>
                  <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5" fill="#0B1522" stroke="url(#hsg)" strokeWidth="2.5"/>
                  <path d="M10 32 Q32 12 54 32 Q32 52 10 32 Z" fill="none" stroke="url(#hsg)" strokeWidth="2.5" strokeLinejoin="round"/>
                  <g className="hs-iris"><circle cx="32" cy="32" r="9" fill="url(#hsi)"/><circle cx="32" cy="32" r="3.6" fill="#0B1522"/><circle cx="35" cy="29" r="1.6" fill="#fff" opacity=".9"/></g>
                </svg>
                <div>
                  <div className="hs-word">HIGH<b>SIGHT</b></div>
                  <div className="hs-tag">DEMO · INVENTED DATA ONLY</div>
                </div>
              </div>
              {data?.filename && <div style={{ color:C.text, fontWeight:600, fontSize:12, marginTop:8 }}>{data.filename.replace(/\.[^.]+$/, '').replace(/_/g,' ')}</div>}
              <div style={{ fontSize:10, marginTop:8, color: buildMismatch ? "#F59E0B" : C.sub }}>
                {serverBuild===undefined ? "…" : serverBuild===null ? "OLD (no build stamp)" : serverBuild}
                {" · "}<a href={`${API}/diagnostics`} target="_blank" rel="noreferrer" style={{ color:C.blue }}>diagnostics</a>
              </div>
            </div>
            {data && (
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                <button data-testid="refresh-sap" onClick={refreshAll} disabled={refBusy}
                  title="Checks the file that is already loaded against SAP again, without dropping it again: generics, colors, sizes, prepack components (variants), prices and stock. Use it after creating articles in SAP."
                  style={{ padding:"8px 14px", background:"none", color:C.text, border:`1px solid ${C.border}`, borderRadius:6, fontSize:12, fontWeight:600, cursor:"pointer" }}>{refBusy ? "Checking SAP…" : "↻ Refresh from SAP"}</button>
                {refAt && <span style={{ color:C.sub, fontSize:10 }}>SAP read {refAt}</span>}
                {refErr && <span style={{ color:C.red, fontSize:11, maxWidth:260 }}>{refErr}</span>}
                {[["TOTAL",nOS+nPPK,C.text],
                  ["PPK",nPPK,C.blue],
                  ["OS",nOS,C.sub]].map(([k,v,color])=>(
                  <div key={k} style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:6,
                    padding:"6px 14px", textAlign:"center" }}>
                    <div style={{ color:C.sub, fontSize:10, fontWeight:600 }}>{k}</div>
                    <div style={{ color, fontWeight:700, fontSize:16 }}>{v}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {buildMismatch && (
            <div style={{ background:"#2D1B00", borderBottom:"1px solid #92400E", color:"#F59E0B", padding:"10px 16px", fontSize:13 }}>
              {serverBuild==="unreachable"
                ? "Cannot reach the server - is server.py running?"
                : `This page (${PAGE_BUILD}) and the server (${serverBuild===null ? "old build" : serverBuild}) are from different builds. Copy BOTH server.py and portal.html into SAP TOOLS, stop the server with Ctrl+C and start it again.`}
            </div>
          )}

          <div style={{ width:"100%", padding:"16px 16px", display:"flex", gap:16 }}>

            {/* Permanent left sidebar — ROW COUNTS */}
            <div style={{ width:120, flexShrink:0 }}>
              <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, padding:"16px" }}>
                <div style={{ color:C.sub, fontSize:10, fontWeight:600, letterSpacing:1, marginBottom:12 }}>ROW COUNTS</div>
                {[
                  ["TOTAL",  nOS+nPPK],
                  ["PPK",    nPPK],
                  ["OS",     nOS],
                  ["ECOM",   0],
                ].map(([k,v])=>(
                  <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.sub, fontSize:13 }}>{k}</span>
                    <span style={{ fontWeight:700, fontSize:15 }}>{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Main content */}
            <div style={{ flex:1, minWidth:0 }}>
              <TabBar active={tab} onChange={setTab}/>
              {tab===":\\WARP DRIVE"       && <BuysheetsTab setData={setData} goValidate={()=>setTab("Validation")}/>}
              {tab==="Validation"         && <BuysheetTab data={data} setData={setData}/>}
              {tab==="SAP" && <SapTab data={data} setData={setData}/>}
              {tab==="Delivery Flow"  && <DeliveryFlowTab/>}
              {tab==="Create Buysheet"  && <BuysheetDataTab data={data}/>}
              {tab==="Req Upload"     && <ReqsTab data={data}/>}
              {tab==="Prod Check"       && <PoCheckTab saved={chk} setSaved={setChk}/>}
              {tab==="ItemHub"      && <LaunchpadTab saved={lp} setSaved={setLp}/>}
              {tab==="RetailPortal"     && <RetailPortalTab/>}

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
